<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- Novus v19.1: Dealer/TSE read-only views. Existing backend contract preserved. -->
<title>Novus Solutions – Cement Order & Document Portal</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f6fa;color:#1a1d23;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.lw{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lc{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:40px;width:440px;max-width:95vw;box-shadow:0 4px 24px rgba(0,0,0,.07)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.bi{width:44px;height:44px;background:#f59e0b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#0f1117;flex-shrink:0}
.bn{font-size:18px;font-weight:700;color:#111827}
.bs{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em}
.lc h2{font-size:21px;font-weight:700;color:#111827;margin-bottom:5px}
.lsub{font-size:13px;color:#6b7280;margin-bottom:20px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.field input,.field select{width:100%;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:7px;padding:10px 12px;color:#111827;font-size:14px;outline:none;font-family:inherit;transition:border .15s}
.field input:focus{border-color:#f59e0b}.field select option{background:#1a1e2a}
.btn-login{width:100%;background:#f59e0b;border:none;border-radius:8px;padding:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-login:hover{opacity:.85}.btn-login:disabled{opacity:.5;cursor:not-allowed}
.hbox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px;padding:13px;margin-top:18px}
.hbox h4{font-size:11px;color:#f59e0b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.hr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1e2330;cursor:pointer}
.hr:last-child{border-bottom:none}.hr:hover .he{color:#d97706}
.he{font-size:12px;color:#9ca3af;transition:color .12s}
.hrl{background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:4px;font-size:10px;text-transform:uppercase;font-weight:600}
.ebox{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:7px;padding:10px 14px;font-size:13px;margin-bottom:13px}
.shell{display:flex;min-height:100vh}
.sidebar{width:226px;background:#fff;border-right:1.5px solid #e5e7eb;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sbb{padding:16px 16px 13px;border-bottom:1.5px solid #e5e7eb}
.nlbl{font-size:10px;color:#4b5563;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px 3px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:1px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:#6b7280;transition:all .12s;user-select:none}
.ni:hover{background:#f9fafb;color:#374151}.ni.active{background:#fef3c7;color:#d97706}
.nbadge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.sbf{margin-top:auto;padding:13px 14px;border-top:1.5px solid #e5e7eb}
.uc{display:flex;align-items:center;gap:8px}
.uav{width:32px;height:32px;border-radius:50%;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.un{font-size:13px;font-weight:500;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ur{font-size:10px;color:#6b7280;text-transform:uppercase}
.lob{margin-left:auto;background:none;border:none;color:#6b7280;cursor:pointer;font-size:18px;padding:2px 5px}
.lob:hover{color:#ef4444}
.main{flex:1;overflow-y:auto;background:#f5f6fa}
.ph{padding:20px 26px 14px;border-bottom:1.5px solid #e5e7eb;background:#fff;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
.pt{font-size:20px;font-weight:700;color:#111827;margin-bottom:3px}
.ps{font-size:13px;color:#6b7280}
.pb{padding:20px 26px}
.card{background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1.5px solid #e5e7eb;background:#fff;flex-wrap:wrap;gap:8px}
.ct{font-size:14px;font-weight:700;color:#111827}
.cb{padding:14px 16px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:700px){.sg{grid-template-columns:1fr 1fr}}
.sc{background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:13px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sv{font-size:26px;font-weight:800;color:#f59e0b;margin-bottom:2px}
.sl{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bp{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.ba{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.bv{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.bd{background:#fff7ed;color:#ea580c;border:1px solid #fed7aa}
.bdi{background:#faf5ff;color:#7c3aed;border:1px solid #ddd6fe}
.bcl{background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:500px}
.tbl th{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;padding:8px 11px;text-align:left;border-bottom:1.5px solid #e5e7eb;white-space:nowrap;background:#f9fafb}
.tbl td{padding:10px 11px;font-size:13px;color:#374151;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:#f9fafb}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;border:1px solid;transition:all .12s;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bam{background:#fffbeb;border-color:#fde68a;color:#d97706}.bam:hover:not(:disabled){background:#fef3c7}
.bgr{background:#f0fdf4;border-color:#bbf7d0;color:#16a34a}.bgr:hover:not(:disabled){background:#dcfce7}
.bbl{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}.bbl:hover:not(:disabled){background:#dbeafe}
.brd{background:#fef2f2;border-color:#fecaca;color:#dc2626}.brd:hover:not(:disabled){background:#fee2e2}
.bgh{background:#fff;border-color:#e5e7eb;color:#6b7280}.bgh:hover:not(:disabled){background:#f9fafb;color:#374151}
.bsm{padding:5px 10px;font-size:11px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fg label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:7px;padding:8px 11px;color:#111827;font-size:13px;font-family:inherit;outline:none;transition:border .12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#f59e0b;background:#fff}
.fg select option{background:#fff}.fg textarea{resize:vertical;min-height:70px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:600px){.r2,.r3{grid-template-columns:1fr}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1.5px solid #e5e7eb}
.mt{font-size:16px;font-weight:700;color:#111827}
.mb{padding:20px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1.5px solid #e5e7eb;background:#f9fafb}
.cr{display:flex;align-items:center;gap:7px;padding:8px 11px;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;margin-bottom:5px}
.cn{flex:1;font-size:13px;color:#374151;font-weight:500}
.ci{width:68px;background:#fff;border:1.5px solid #e5e7eb;border-radius:6px;padding:5px 7px;color:#111827;font-size:13px;font-family:inherit;outline:none;text-align:center;transition:border .12s}
.ci:focus{border-color:#f59e0b}.cs{width:42px;color:#f59e0b}
.alert{display:flex;align-items:flex-start;gap:8px;padding:10px 13px;border-radius:8px;margin-bottom:13px;font-size:13px;line-height:1.5}
.aw{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.ai{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
.aok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.aer{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.uz{border:2px dashed #e5e7eb;border-radius:10px;padding:18px;text-align:center;cursor:pointer;position:relative;transition:border .15s;margin-top:6px;background:#f9fafb}
.uz:hover{border-color:#f59e0b;background:#fffbeb}
.uz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.empty{text-align:center;padding:38px;color:#9ca3af}
.empty-i{font-size:38px;margin-bottom:8px}
.chip{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:11px;background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb}
.dc{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:9px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #f59e0b40;border-top-color:#f59e0b;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dopt{border:2px solid #e5e7eb;border-radius:8px;padding:11px;cursor:pointer;background:#f9fafb;transition:all .15s;text-align:center}
.dopt:hover{border-color:#2a2d3a}.dopt.sel{border-color:#f59e0b;background:#fffbeb}
.dopt .di{font-size:20px;margin-bottom:3px}
.dopt .dl{font-size:12px;font-weight:600;color:#9ca3af}.dopt.sel .dl{color:#d97706}
.dmb{background:#111520;border-radius:8px;padding:2px 0}
.dmbr{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #1e2330;font-size:13px}
.dmbr:last-child{border-bottom:none}
.kv{display:flex;flex-direction:column;gap:12px}
.kvi{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1d28;font-size:13px}
.kvi:last-child{border-bottom:none}

@media(max-width:768px){
  .sidebar{position:fixed;left:-226px;top:0;height:100vh;z-index:200;transition:left .25s ease}
  .sidebar.open{left:0;box-shadow:4px 0 24px rgba(0,0,0,.15)}
  .mob-overlay{display:block!important;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}
  .mob-bar{display:flex!important}
  .main{margin-left:0!important}
  .shell{display:block}
  .ph{padding:14px 16px 10px;background:#fff}
  .pb{padding:14px 16px}
  .pt{font-size:18px}
  .r2,.r3{grid-template-columns:1fr}
  .sg{grid-template-columns:1fr 1fr}
  .tbl th:nth-child(3),.tbl td:nth-child(3),
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none}
  .card{border-radius:10px}
  .ch{flex-wrap:wrap;gap:8px}
  .modal{width:100%;border-radius:14px 14px 0 0;position:fixed;bottom:0;left:0;max-height:85vh}
  .ov{align-items:flex-end;padding:0}
}
/* Search dropdown */
.search-dd{position:relative}
.search-dd input{width:100%;background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 12px 9px 34px;color:#111827;font-size:13px;font-family:inherit;outline:none;transition:border .12s}
.search-dd input:focus{border-color:#f59e0b;background:#fff}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:14px;pointer-events:none}
.dd-list{position:fixed;background:#fff;border:1.5px solid #e5e7eb;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:9999;max-height:220px;overflow-y:auto;min-width:300px}
.dd-item{padding:10px 14px;font-size:13px;color:#374151;cursor:pointer;border-bottom:1px solid #f3f4f6;transition:background .1s;display:flex;flex-direction:column;gap:2px;min-height:42px;justify-content:center}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item.selected{background:#fef3c7;color:#d97706}
.dd-empty{padding:10px 12px;font-size:13px;color:#9ca3af;text-align:center}
.mobile-report{display:none}
/* Item-wise receiving grid */
.claim-grid{display:grid;grid-template-columns:1.35fr .8fr repeat(3,.9fr);gap:7px;align-items:center}
.claim-grid input{width:100%;padding:7px 8px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;background:#fff;color:#111827}
.claim-grid input:focus{border-color:#f59e0b;outline:none}
.recv-head{font-size:11px;color:#6b7280;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.recv-row{padding:8px 0;border-bottom:1px solid #f3f4f6}
.recv-row:last-child{border-bottom:none}
.recv-lock{background:#f3f4f6;border:1.5px solid #e5e7eb;border-radius:7px;padding:7px 8px;font-size:13px;color:#6b7280;text-align:center;font-weight:700}
.recv-note{font-size:12px;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;margin:8px 0 10px}
@media(max-width:768px){.desktop-report{display:none!important}.mobile-report{display:block}.report-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:10px}.report-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid #f3f4f6}.report-line:last-child{border-bottom:none}.dd-list{max-height:320px!important}.dd-item{min-height:46px}}
@media(max-width:600px){.claim-grid{grid-template-columns:1fr 1fr 1fr;gap:6px}.recv-head{display:none}.recv-row{background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px;padding:10px;margin-bottom:8px}.recv-row .item-cell{grid-column:1/-1}.recv-cell-label{display:block!important;font-size:10px;color:#9ca3af;text-transform:uppercase;margin-bottom:2px}}

/* Document viewer */
.doc-box{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:14px}
.doc-query{font-size:12px;color:#6b7280;line-height:1.55;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.doc-card{border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
.doc-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.doc-title{font-weight:800;color:#111827;font-size:15px}.doc-sub{font-size:11px;color:#6b7280;margin-top:3px;line-height:1.4}
.doc-empty{padding:26px 16px;text-align:center;color:#6b7280;font-size:13px}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ch .cs{width:auto;max-width:100%;color:#6b7280;line-height:1.35}

/* Material Account */
.mat-summary{display:grid;grid-template-columns:repeat(5,minmax(135px,1fr));gap:10px;margin-bottom:14px}
.mat-stat{background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;padding:14px;min-height:94px}
.mat-stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;font-weight:700;margin-bottom:8px}
.mat-stat .v{font-size:24px;font-weight:800;color:#111827;line-height:1.1}
.mat-stat .s{font-size:11px;color:#6b7280;margin-top:6px;line-height:1.35}
.mat-balance-positive{color:#b45309!important}.mat-balance-negative{color:#047857!important}.mat-balance-zero{color:#374151!important}
.mat-toolbar{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;padding:12px;border-bottom:1px solid #e5e7eb;background:#f9fafb}
.mat-toolbar .fg{min-width:135px;margin:0}.mat-toolbar .fg.grow{flex:1;min-width:210px}
.mat-toolbar input,.mat-toolbar select{width:100%;background:#fff;border:1.5px solid #e5e7eb;border-radius:7px;padding:8px 10px;color:#111827;font-size:12px;font-family:inherit;outline:none}
.mat-toolbar input:focus,.mat-toolbar select:focus{border-color:#f59e0b}
.mat-effect{font-weight:800;white-space:nowrap}.mat-effect.pos{color:#b45309}.mat-effect.neg{color:#047857}.mat-effect.zero{color:#9ca3af}
.mat-type{font-size:11px;font-weight:700;border-radius:20px;padding:3px 8px;display:inline-block;white-space:nowrap}
.mat-dispatch{background:#fff7ed;color:#c2410c}.mat-invoice{background:#ecfdf5;color:#047857}.mat-return{background:#eff6ff;color:#1d4ed8}.mat-direct{background:#f3f4f6;color:#4b5563}
.mat-empty{text-align:center;padding:36px 16px;color:#6b7280;font-size:13px}
.mat-history{font-size:12px;color:#6b7280;line-height:1.5}
.mat-items{font-size:12px;line-height:1.6}.mat-item-chip{display:inline-block;background:#f9fafb;border:1px solid #e5e7eb;border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0}.mat-narr summary{cursor:pointer;color:#2563eb;font-weight:700;font-size:12px}.mat-narr div{margin-top:5px;max-width:380px;white-space:normal;color:#4b5563;line-height:1.45}.mat-subtle{font-size:10px;color:#9ca3af;margin-top:2px}
.mat-load{display:flex;justify-content:center;padding:14px;border-top:1px solid #f3f4f6}
.mat-table-wrap{overflow:auto;max-width:100%}.mat-table{min-width:960px}
@media(max-width:980px){.mat-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.mat-summary{grid-template-columns:1fr 1fr}.mat-stat .v{font-size:20px}.mat-toolbar{align-items:stretch}.mat-toolbar .fg,.mat-toolbar .fg.grow{min-width:calc(50% - 6px);flex:1}.mat-table th,.mat-table td{display:table-cell!important}}
.mat-mobile-cards{display:none}
@media(max-width:700px){
  .mat-desktop-table{display:none!important}
  .mat-mobile-cards{display:block;padding:10px 12px}
  .mat-mobile-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.035)}
  .mat-mobile-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
  .mat-mobile-title{font-size:13px;font-weight:800;color:#111827;line-height:1.35}
  .mat-mobile-sub{font-size:10px;color:#9ca3af;margin-top:2px}
  .mat-mobile-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-top:1px solid #f3f4f6}
  .mat-mobile-line:first-of-type{border-top:none}
  .mat-mobile-label{color:#6b7280}
  .mat-mobile-value{font-weight:700;color:#374151;text-align:right}
  .mat-mobile-narr{font-size:12px;color:#4b5563;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:8px;margin-top:8px;line-height:1.45}
}


/* v19.1 read-only role views. Scoped to avoid changing operational screens. */
.main{min-width:0}
.v19{--blue:#087bbd;--ink:#17344c;--muted:#607385;--line:#e1eaf0;font-size:14px;color:var(--ink);padding:24px;max-width:1520px;margin:auto}
.v19 button,.v19 input,.v19 select{font:inherit}
.v19 button{cursor:pointer}
.v19 button:disabled{cursor:not-allowed;opacity:.55}

function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
        if (!file)
            return reject(new Error('Please choose a file first'));
        if (file.type && file.type.startsWith('image/')) {
            const img = new Image();
            const reader = new FileReader();
            reader.onload = () => {
                img.onload = () => {
                    const max = 1200;
                    let w = img.width, h = img.height;
                    if (w > h && w > max) {
                        h = Math.round(h * max / w);
                        w = max;
                    }
                    else if (h >= w && h > max) {
                        w = Math.round(w * max / h);
                        h = max;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.68));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        }
        else {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        }
    });
