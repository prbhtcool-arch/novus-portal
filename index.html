// ── Helpers ────────────────────────────────────
function sLabel(s){return{placed:'Order Placed – Waiting for Approval',approved:'Order Approved – Looking for Vehicle',vehicle_found:'Vehicle Found – Loading Started',dispatched:'Loading Complete – Vehicle Dispatched',receiving_disputed:'Receiving Disputed – Logistics Approval Pending',return_pending:'Return Pending – Warehouse Confirmation',closed:'Order Closed'}[s]||s;}

function fmtDT(d){try{return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return d;}}

// ── API (JSONP) ─────────────────────────────────
function apiJSONP(action,payload={}){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const flat={action,callback:cb};
    for(const k in payload){
      const v=payload[k];
      flat[k]=(v!==null&&typeof v==='object')?JSON.stringify(v):String(v);
    }
    const script=document.createElement('script');
    script.src=CFG.SCRIPT_URL+'?'+new URLSearchParams(flat).toString();
    const timer=setTimeout(()=>{
      delete window[cb];
      if(document.body.contains(script)) document.body.removeChild(script);
      reject(new Error('Request timeout'));
    },45000);
    window[cb]=(data)=>{
      clearTimeout(timer);
      delete window[cb];
      if(document.body.contains(script)) document.body.removeChild(script);
      if(data.error) reject(new Error(data.error));
      else resolve(data);
    };
    script.onerror=()=>{
      clearTimeout(timer);
      delete window[cb];
      reject(new Error('Network error'));
    };
    document.body.appendChild(script);
  });
}

    iframe.name=iframeName;
    iframe.style.display='none';

    const form=document.createElement('form');
    form.method='POST';
    form.action=CFG.SCRIPT_URL;
    form.target=iframeName;
    form.style.display='none';
    form.enctype='application/x-www-form-urlencoded';

    let settled=false;
    let submitted=false;
    let fallbackLoadTimer=null;

    const add=(name,value)=>{
      const input=document.createElement('input');
      input.type='hidden';
      input.name=name;
      input.value=value==null?'':String(value);
      form.appendChild(input);
    };
    add('action',action);
    add('postMessageId',postId);
    for(const k in payload){
      const v=payload[k];
      add(k,(v!==null&&typeof v==='object')?JSON.stringify(v):v);
    }

    const cleanup=()=>{
      window.removeEventListener('message',onMessage);
      if(fallbackLoadTimer) clearTimeout(fallbackLoadTimer);
      setTimeout(()=>{
        if(document.body.contains(form)) document.body.removeChild(form);
        if(document.body.contains(iframe)) document.body.removeChild(iframe);
      },500);
    };
    const finish=(data)=>{
      if(settled) return;
      settled=true;
      clearTimeout(timer);
      cleanup();
      if(data&&data.error) reject(new Error(data.error));
      else resolve(data||{success:true,responseLost:true});
    };
    const timer=setTimeout(()=>{
      // Do not blindly mark upload successful if Apps Script response is lost.
      // Resolve as needsVerify; the caller will confirm the Drive URL/status from Google Sheets.
      finish({success:false,needsVerify:true,responseLost:true});
    },150000);
    const onMessage=(event)=>{
      const data=event.data;
      if(!data||data.novusPostId!==postId) return;
      finish(data);
    };
    iframe.onload=()=>{
      if(!submitted||settled) return;
      // If Apps Script's HtmlService response loads but postMessage is dropped,
      // do not assume success. Ask the caller to verify against Google Sheets.
      fallbackLoadTimer=setTimeout(()=>finish({success:false,needsVerify:true,responseLost:true}),2500);
    };
    window.addEventListener('message',onMessage);
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    submitted=true;
    form.submit();
  });
}

function api(action,payload={}){
  if(CFG.DEMO_MODE) return Promise.reject(new Error('DEMO_MODE'));
  const hasFilePayload=Object.prototype.hasOwnProperty.call(payload,'photoData');
  if(hasFilePayload) return apiPost(action,payload);
  return apiJSONP(action,payload);
}
function demoFallback(e,fn){if(e.message==='DEMO_MODE'){fn();return true;}return false;}

async function verifyUploadAfterResponse(res,user,orderId,checkFn,setOrders){
  if(!res || !res.needsVerify) return res || {};
  // Give Apps Script a brief moment to finish writing Drive URL / order status to Sheets.
  await new Promise(r=>setTimeout(r,1200));
  const appData=await apiJSONP('getAppData',{email:user.email});
  if(appData && appData.orders) setOrders(appData.orders);
  const ord=(appData.orders||[]).find(o=>o.id===orderId);
  if(ord && checkFn(ord)){
    return {
      success:true,
      verified:true,
      url:ord.challanPhotoUrl||ord.receivingDealerUrl||ord.receivingLogisticsUrl||''
    };
  }
  throw new Error('Upload response was not received and the upload could not be verified in Google Sheets. Please check Drive/Sheets and try again.');
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    if(!file) return reject(new Error('Please choose a file first'));
    if(file.type && file.type.startsWith('image/')){
      const img=new Image();
      const reader=new FileReader();
      reader.onload=()=>{img.onload=()=>{
        const max=1200;
        let w=img.width,h=img.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
        else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.68));
      }; img.onerror=reject; img.src=reader.result;};
      reader.onerror=reject; reader.readAsDataURL(file);
    } else {
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    }
  });
}

function safeFileExt(file){
  if(!file||!file.name) return 'jpg';
  const m=file.name.toLowerCase().match(/\.([a-z0-9]+)$/);
  return m?m[1]:'jpg';
}

function App(){
  const[user,setUser]=useState(()=>{
    try{
      const raw=localStorage.getItem('novus_user');
      if(!raw) return null;
      const{user:u,loginTime}=JSON.parse(raw);
      if(Date.now()-loginTime>24*60*60*1000){localStorage.removeItem('novus_user');return null;}
      return u;
    }catch{return null;}
  });
  const[orders,setOrders]=useState(CFG.DEMO_MODE?DEMO_ORDERS:[]);
  const[dealers,setDealers]=useState(CFG.DEMO_MODE?DEMO_DEALERS:{});
  const[locationData,setLocationData]=useState([]);
  const[freightMatrix,setFreightMatrix]=useState([]);
  const[warehouses,setWarehouses]=useState(WHS);
  const[vehicles,setVehicles]=useState([]);
  const[drivers,setDrivers]=useState([]);
  const[appLoaded,setAppLoaded]=useState(CFG.DEMO_MODE);

  const handleSetUser=(u)=>{
    if(u) localStorage.setItem('novus_user',JSON.stringify({user:u,loginTime:Date.now()}));
    else localStorage.removeItem('novus_user');
    setUser(u);
  };

  useEffect(()=>{
    if(!user||CFG.DEMO_MODE||appLoaded) return;
    setAppLoaded(true);
    api('getAppData',{email:user.email}).then(appData=>{
      if(appData.orders) setOrders(appData.orders);
      let nd={};
      if(appData.dealers&&appData.dealers.length>0) nd=Object.fromEntries(appData.dealers.map(d=>[d.id,d]));
      if(appData.dealerData&&user.role==='dealer') nd[user.id]={name:user.name,territory:user.territory,retailers:appData.dealerData.retailers||[],sites:appData.dealerData.sites||[]};
      if(Object.keys(nd).length>0) setDealers(nd);
      if(appData.locationData) setLocationData(appData.locationData);
      if(appData.freightMatrix) setFreightMatrix(appData.freightMatrix);
      if(appData.warehouses&&appData.warehouses.length>0) setWarehouses(appData.warehouses);
      if(appData.vehicles) setVehicles(appData.vehicles);
      if(appData.drivers) setDrivers(appData.drivers);
    }).catch(()=>{});
  },[user]);

  useEffect(()=>{
    if(!user) return;
    const t=setInterval(()=>{
      try{
        const raw=localStorage.getItem('novus_user');
        if(!raw){setUser(null);return;}
        if(Date.now()-JSON.parse(raw).loginTime>24*60*60*1000){
          localStorage.removeItem('novus_user');setUser(null);
          alert('Session expired. Please log in again.');
        }
      }catch{setUser(null);}
    },60*1000);
    return()=>clearInterval(t);
  },[user]);

  if(!user)return <Login setUser={handleSetUser} setOrders={setOrders} setDealers={setDealers}/>;
  if(!appLoaded)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#f5f6fa',flexDirection:'column',gap:12}}>
      <div className="spin" style={{width:36,height:36,borderWidth:3}}/>
      <div style={{fontSize:14,color:'#6b7280',fontWeight:500}}>Loading your portal...</div>
    </div>
  );
  return <Shell user={user} setUser={handleSetUser} orders={orders} setOrders={setOrders} dealers={dealers} setDealers={setDealers} locationData={locationData} freightMatrix={freightMatrix} warehouses={warehouses} vehicles={vehicles} setVehicles={setVehicles} drivers={drivers} setDrivers={setDrivers}/>;
}

           (i.block||'').toLowerCase().includes(q);
  });
  const showAdd=onAddNew&&query.trim().length>1&&!filtered.find(i=>(i[labelKey]||'').toLowerCase()===query.toLowerCase());

  useEffect(()=>{
    const h=(e)=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    const r=()=>{if(open) updateDropPosition();};
    document.addEventListener('mousedown',h);window.addEventListener('resize',r);window.addEventListener('scroll',r,true);
    return()=>{document.removeEventListener('mousedown',h);window.removeEventListener('resize',r);window.removeEventListener('scroll',r,true);};
  },[open]);

  const select=(item)=>{ onChange(item[valueKey]); setQuery(''); setOpen(false); };

  const handleAdd=()=>{
    if(!newName.trim()) return;
    onAddNew({name:newName.trim(),phone:newPhone.trim()},
      (newItem)=>{ onChange(newItem[valueKey]); setAddModal(false); setNewName(''); setNewPhone(''); setOpen(false); }
    );
  };

  return(
    <div className="search-dd" ref={ref}>
      <span className="search-icon">&#128269;</span>
      <input
        ref={inputRef}
        value={open?query:(selected?selected[labelKey]:'')}
        onChange={e=>{setQuery(e.target.value);setOpen(true);updateDropPosition();}}
        onFocus={()=>{setOpen(true);setQuery('');updateDropPosition();}}
        placeholder={placeholder||'Search...'}
      />
      {open&&(
        <div className="dd-list" style={dropPos}>
          {filtered.map(item=>(
            <div key={item[valueKey]} className={`dd-item${item[valueKey]===value?' selected':''}`} onMouseDown={()=>select(item)}>
              <span style={{fontWeight:500}}>{item[labelKey]}
                {item.alias&&<span style={{color:'#9ca3af',fontWeight:400,fontSize:11}}> ({item.alias})</span>}
              </span>
              {(item.village||item.block)&&<span style={{fontSize:11,color:'#9ca3af'}}>{[item.village,item.block,item.tehsil].filter(Boolean).join(' - ')}</span>}
            </div>
          ))}
          {showAdd&&(
            <div className="dd-item" style={{color:'#16a34a',fontWeight:600,borderTop:'1.5px solid #e5e7eb'}}
              onMouseDown={e=>{e.preventDefault();setNewName(query);setAddModal(true);setOpen(false);}}>
              + Add "{query}" as new {addNewLabel||'entry'}
            </div>
          )}
          {filtered.length===0&&!showAdd&&<div className="dd-empty">No results found</div>}
        </div>
      )}
      {addModal&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setAddModal(false)}>
          <div className="modal">
            <div className="mh"><span className="mt">Add New {addNewLabel||'Entry'}</span>
              <button className="btn bgh bsm" onClick={()=>setAddModal(false)}>X</button>
            </div>
            <div className="mb">
              <div className="fg"><label>Name</label>
                <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Shop name"/>
              </div>
              <div className="fg"><label>Phone (optional)</label>
                <input value={newPhone} onChange={e=>setNewPhone(e.target.value)} placeholder="Mobile number"/>
              </div>
            </div>
            <div className="mf">
              <button className="btn bgh" onClick={()=>setAddModal(false)}>Cancel</button>
              <button className="btn bgr" onClick={handleAdd}>Save & Select</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

//  LOCATION & RETAILER HELPERS
// ══════════════════════════════════════════════
function shortDealerId(id){ return id?id.replace('090',''):id; }
function nextConsigneeCode(dealerId,retailers){
  const prefix='C-'+shortDealerId(dealerId)+'-';
  const nums=(retailers||[]).filter(r=>r.id&&r.id.startsWith(prefix)).map(r=>parseInt(r.id.replace(prefix,''))||0);
  return prefix+String((nums.length>0?Math.max(...nums):0)+1).padStart(3,'0');
}
function LocationPicker({locationData,value,onChange}){
  const v=value||{};
  const ld=locationData||[];
  const districts=[...new Set(ld.map(l=>l.district))].sort();
  const tehsils=v.district?[...new Set(ld.filter(l=>l.district===v.district).map(l=>l.tehsil))].sort():[];
  const blocks=v.tehsil?[...new Set(ld.filter(l=>l.district===v.district&&l.tehsil===v.tehsil).map(l=>l.block))].sort():[];
  const villages=v.block?[...new Set(ld.filter(l=>l.district===v.district&&l.tehsil===v.tehsil&&l.block===v.block).map(l=>l.village))].sort():[];
  const set=(f,val)=>{
    const u={[f]:val};
    if(f==='district'){u.tehsil='';u.block='';u.village='';}
    if(f==='tehsil'){u.block='';u.village='';}
    if(f==='block') u.village='';
    onChange({...v,...u});
  };
  if(!ld.length) return <div className="alert ai" style={{marginBottom:0}}><span>Info</span>Location list loading...</div>;
  return <div>
    <div className="r2">
      <div className="fg"><label>District</label>
        <select value={v.district||''} onChange={e=>set('district',e.target.value)}>
          <option value="">-- District --</option>
          {districts.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
      </div>
      <div className="fg"><label>Tehsil</label>
        <select value={v.tehsil||''} onChange={e=>set('tehsil',e.target.value)} disabled={!v.district}>
          <option value="">-- Tehsil --</option>
          {tehsils.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </div>
    </div>
    <div className="r2">
      <div className="fg"><label>Block</label>
        <select value={v.block||''} onChange={e=>set('block',e.target.value)} disabled={!v.tehsil}>
          <option value="">-- Block --</option>
          {blocks.map(b=><option key={b} value={b}>{b}</option>)}
        </select>
      </div>
      <div className="fg"><label>Village / Market</label>
        <select value={v.village||''} onChange={e=>set('village',e.target.value)} disabled={!v.block}>
          <option value="">-- Village --</option>
          {villages.map(vl=><option key={vl} value={vl}>{vl}</option>)}
        </select>
      </div>
    </div>
    {v.village&&<div className="alert aok" style={{padding:'5px 10px',marginTop:4,marginBottom:0}}>
      <span>Location:</span> <span style={{fontSize:12}}>{v.village} - {v.block} - {v.tehsil} - {v.district}</span>
    </div>}
  </div>;
}

// ══════════════════════════════════════════════
function PlaceOrder({user,orders,setOrders,dealers,setDealers,warehouses}){
  const d=dealers[user.id];
  const[dest,setDest]=useState('counter');
  const[destId,setDestId]=useState('');
  const[wh,setWh]=useState('WH1');
  const[type,setType]=useState('FOR');
  const[items,setItems]=useState(CEMENTS.map(c=>({cement:c,qty:'',seq:''})));
  const[done,setDone]=useState(false);
  const[saving,setSaving]=useState(false);
  const blocked=orders.some(o=>{
    if(o.dealer!==user.id||o.status!=='dispatched') return false;
    if(o.dealerReceivingUploaded) return false;
    if(!o.dispatchedAt) return false;
    const dispatchedTime=new Date(o.dispatchedAt).getTime();
    if(Number.isNaN(dispatchedTime)) return false;
    return (Date.now()-dispatchedTime)/(1000*60*60)>24;
  });
  const total=totalBags(items);

  const submit=async()=>{
    const sel=items.filter(i=>parseInt(i.qty)>0).map(i=>({cement:i.cement,qty:parseInt(i.qty),seq:parseInt(i.seq)||1}));
    if(!sel.length){alert('Add at least one cement item');return;}
    if((dest==='retailer'||dest==='site')&&!destId){alert('Please select a destination');return;}
    const destName=dest==='counter'?d.name:dest==='retailer'?d.retailers.find(r=>r.id===destId)?.name:d.sites.find(s=>s.id===destId)?.name;
    const o={id:'ORD'+Date.now().toString().slice(-6),dealer:user.id,dealerName:user.name,territory:user.territory,warehouse:wh,type,destination:dest==='counter'?'Counter':dest==='retailer'?'Retailer':'Site',destName,items:sel,status:'placed',placedAt:new Date().toISOString(),challanId:null,vehicle:null,receivingUploaded:false,remarks:''};
    setSaving(true);
    try{await api('addOrder',{order:o,items:sel});}catch(e){if(!demoFallback(e,()=>{})){alert('Error: '+e.message);setSaving(false);return;}}
    setOrders(prev=>[...prev,o]);
    setDone(true);setSaving(false);
  };

  if(blocked)return<><div className="ph"><div className="pt">Place Order</div></div><div className="pb"><div className="alert aw"><span>⛔</span><div><strong>Orders blocked.</strong> Upload receiving for all dispatched challans first.</div></div></div></>;
  if(done)return<><div className="ph"><div className="pt">Place Order</div></div><div className="pb"><div className="alert aok"><span>✅</span><strong>Order placed!</strong> Your TSE will approve it shortly.</div><button className="btn bam" onClick={()=>{setDone(false);setItems(CEMENTS.map(c=>({cement:c,qty:'',seq:''})));setDestId('');setDest('counter');}}>+ Place Another Order</button></div></>;

  return <>
    <div className="ph"><div><div className="pt">Place New Order</div><div className="ps">Total: <strong style={{color:'#d97706'}}>{total} bags</strong></div></div></div>
    <div className="pb">
      <div className="card">
        <div className="ch"><span className="ct">Step 1 — Delivery Destination</span></div>
        <div className="cb">
          <div className="r3" style={{marginBottom:12}}>
            {[['counter','🏬','My Counter'],['retailer','🏪','Retailer'],['site','🏗️','Site']].map(([v,ic,lb])=>(
              <div key={v} className={`dopt${dest===v?' sel':''}`} onClick={()=>{setDest(v);setDestId('');}}>
                <div className="di">{ic}</div><div className="dl">{lb}</div>
              </div>
            ))}
          </div>
          {dest==='retailer'&&<div className="fg"><label>Select Retailer</label>
            <SearchDropdown items={d.retailers} value={destId} onChange={setDestId}
              placeholder="Search retailer name or alias..." labelKey="name" valueKey="id"
              addNewLabel="Retailer"
              onAddNew={(data,cb)=>{
                const newR={id:'R'+Date.now(),name:data.name,alias:'',phone:data.phone||'',type:'Consignee',village:'',block:'',tehsil:'',district:''};
                setDealers(prev=>({...prev,[user.id]:{...d,retailers:[...d.retailers,newR]}}));
                api('addRetailer',{dealerId:user.id,...newR}).catch(()=>{});
                cb(newR);
              }}/>
          </div>}
          {dest==='site'&&<div className="fg"><label>Select Site</label>
            <SearchDropdown items={d.sites} value={destId} onChange={setDestId}
              placeholder="Search site name..." labelKey="name" valueKey="id"
              addNewLabel="Site"
              onAddNew={(data,cb)=>{
                const newS={id:'S'+Date.now(),name:data.name,village:'',block:'',tehsil:'',district:''};
                setDealers(prev=>({...prev,[user.id]:{...d,sites:[...d.sites,newS]}}));
                api('addSite',{dealerId:user.id,...newS}).catch(()=>{});
                cb(newS);
              }}/>
          </div>}
        </div>
      </div>
      <div className="card">
        <div className="ch"><span className="ct">Step 2 — Warehouse & Dispatch Type</span></div>
        <div className="cb">
          <div className="r2">
            <div className="fg"><label>Preferred Warehouse</label><select value={wh} onChange={e=>setWh(e.target.value)}>{(warehouses||WHS).filter(w=>{const t=(w.allowedTerritories||w.territories||'').split(',').map(x=>x.trim());return !t.length||t[0]===''||t.includes(user.territory);}).map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
            <div className="fg"><label>Dispatch Type</label><select value={type} onChange={e=>setType(e.target.value)}><option value="FOR">FOR – Logistics arranges vehicle</option><option value="EX">EX – Own vehicle</option></select></div>
          </div>
        </div>
      </div>
      <div className="card">
        <div className="ch"><span className="ct">Step 3 — Items & Loading Sequence</span><span style={{fontSize:11,color:'#6b7280'}}>Seq = loading order</span></div>
        <div className="cb">
          {items.map((item,i)=>(
            <div key={item.cement} className="cr">
              <span className="cn">{item.cement}</span>
              <span style={{fontSize:11,color:'#6b7280'}}>Bags</span>
              <input className="ci" type="number" min="0" value={item.qty} placeholder="0" onChange={e=>setItems(items.map((it,j)=>j===i?{...it,qty:e.target.value}:it))}/>
              <span style={{fontSize:11,color:'#6b7280'}}>Seq</span>
              <input className="ci cs" type="number" min="1" value={item.seq} placeholder="#" onChange={e=>setItems(items.map((it,j)=>j===i?{...it,seq:e.target.value}:it))}/>
            </div>
          ))}
          <div style={{marginTop:12,textAlign:'right'}}><button className="btn bam" onClick={submit} disabled={saving}>{saving?<><span className="spin"/> Saving…</>:'Submit Order →'}</button></div>
        </div>
      </div>
    </div>
  </>;
}

function DealerOrders({user,orders,setOrders,myOrders,filter,title,warehouses}){
  const list=myOrders.filter(o=>filter.includes(o.status));
  const[uploadId,setUploadId]=useState(null);
  const[remarks,setRemarks]=useState('');

  const markReceived=async(id,file,receivingItems=[],remarksText='')=>{
    if(!file){alert('Please choose the receiving photo/PDF first');return;}
    const ord=orders.find(o=>o.id===id);
    try{
      const photoData=await fileToDataUrl(file);
      const res0=await api('uploadReceivingPhoto',{orderId:id,challanId:ord?.challanId||'',manualChallanNo:ord?.manualChallanNo||ord?.challanId||id,warehouseName:whName(ord?.warehouse||'',warehouses),uploadedBy:user.email,uploaderRole:'dealer',remarks:remarksText||remarks,fileExt:safeFileExt(file),photoData,receivingItems});
      const res=await verifyUploadAfterResponse(res0,user,id,o=>!!(o.receivingDealerUrl||o.dealerReceivingUploaded),setOrders);
      if(res.verified){ setUploadId(null); setRemarks(''); return; }
      const hasClaim=(receivingItems||[]).some(i=>(parseInt(i.shortQty)||0)+(parseInt(i.damagedQty)||0)+(parseInt(i.returnedQty)||0)>0);
      const upd={dealerReceivingUploaded:true,receivingDealerUrl:res.url||ord?.receivingDealerUrl||'',receivingUploaded:true,status:hasClaim?'receiving_disputed':(ord?.logisticsReceivingUploaded?'closed':ord?.status),remarks:remarksText||remarks||ord?.remarks,receivingItems};
      setOrders(orders.map(o=>o.id===id?{...o,...upd}:o));
    }catch(e){if(!demoFallback(e,()=>{})){alert('Upload failed: '+e.message);return;}}
    setUploadId(null);setRemarks('');
  };

  return <>
    <div className="ph"><div className="pt">{title}</div><div className="ps">{list.length} order(s)</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">📋</div>No orders here</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#d97706'}}>{o.id}</strong>
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <span style={{fontSize:12,color:'#6b7280'}}>{fmtD(o.placedAt)}</span>
          </div>
          <div className="cb">
            <OInfo o={o} warehouses={warehouses}/>
            {o.status==='dispatched'&&!o.dealerReceivingUploaded&&(
              <div className="alert aw" style={{marginTop:12}}>
                <span>⚠️</span><div><strong>Action Required:</strong> Upload receiving for challan <strong>{o.challanId}</strong> within 24 hours.
                <button className="btn bam bsm" style={{marginLeft:10}} onClick={()=>setUploadId(o.id)}>📷 Upload Receiving</button></div>
              </div>
            )}
            {o.dealerReceivingUploaded&&<div className={`alert ${o.status==='receiving_disputed'?'aw':'aok'}`} style={{marginTop:10}}><span>{o.status==='receiving_disputed'?'⚠️':'✅'}</span> {o.status==='receiving_disputed'?'Receiving uploaded — claim sent for logistics approval':'Receiving uploaded'}{o.remarks?` · Remarks: ${o.remarks}`:''}</div>}
          </div>
        </div>
      ))}
    </div>
    {uploadId&&(
      <ItemReceivingModal
        order={orders.find(o=>o.id===uploadId)||{}}
        title="Upload Item-wise Receiving"
        subtitle="Enter actual received quantity item-wise. Short/damaged/returned bags will go to logistics approval; no credit is created automatically."
        onClose={()=>{setUploadId(null);setRemarks('');}}
        onSave={(file,receivingItems,remarksText)=>markReceived(uploadId,file,receivingItems,remarksText)}
      />
    )}
  </>;
}

function Contacts({user,dealers,setDealers,type,locationData}){
  const d=dealers[user.id]||{name:user.name,retailers:[],sites:[]};
  const[modal,setModal]=useState(false);
  const[name,setName]=useState('');
  const[alias,setAlias]=useState('');
  const[rtype,setRtype]=useState('Consignee');
  const[phone,setPhone]=useState('');
  const[loc,setLoc]=useState({});
  const items=type==='retailers'?(d.retailers||[]):(d.sites||[]);
  const locStr=(it)=>[it.village,it.block,it.tehsil,it.district].filter(Boolean).join(' - ');

  const save=async()=>{
    if(!name.trim())return;
    const newId=type==='retailers'
      ?(rtype==='Authorized'?('R'+Date.now()):nextConsigneeCode(user.id,d.retailers||[]))
      :('S'+Date.now());
    const newItem=type==='retailers'
      ?{id:newId,name:name.trim(),alias:alias.trim(),type:rtype,
        village:loc.village||'',block:loc.block||'',tehsil:loc.tehsil||'',district:loc.district||'',phone:phone.trim()}
      :{id:newId,name:name.trim(),
        village:loc.village||'',block:loc.block||'',tehsil:loc.tehsil||'',district:loc.district||''};
    try{
      if(type==='retailers') await api('addRetailer',{dealerId:user.id,...newItem});
      else await api('addSite',{dealerId:user.id,...newItem});
    }catch(e){demoFallback(e,()=>{});}
    setDealers({...dealers,[user.id]:{...d,[type]:[...items,newItem]}});
    setModal(false);setName('');setAlias('');setPhone('');setLoc({});setRtype('Consignee');
  };

  return <>
    <div className="ph">
      <div><div className="pt">{type==='retailers'?'My Retailers':'My Sites'}</div><div className="ps">{items.length} registered</div></div>
      <button className="btn bam" onClick={()=>setModal(true)}>+ Add {type==='retailers'?'Retailer':'Site'}</button>
    </div>
    <div className="pb">
      {items.length===0&&<div className="card"><div className="empty"><div className="empty-i">{type==='retailers'?'[shop]':'[site]'}</div>None added yet</div></div>}
      {items.map(it=>(
        <div key={it.id} className="dc">
          <div style={{flex:1}}>
            <div style={{fontWeight:600,color:'#111827'}}>{it.name}
              {it.alias&&<span style={{color:'#9ca3af',fontWeight:400,fontSize:12}}> ({it.alias})</span>}
            </div>
            <div style={{fontSize:12,color:'#6b7280',marginTop:1}}>{locStr(it)||it.phone||''}</div>
            <div style={{fontSize:11,color:'#9ca3af',marginTop:1}}>{it.id}</div>
          </div>
          <span className="chip" style={{fontSize:10,flexShrink:0,
            background:it.type==='Authorized'?'#f0fdf4':'#fffbeb',
            color:it.type==='Authorized'?'#16a34a':'#d97706',
            border:it.type==='Authorized'?'1px solid #bbf7d0':'1px solid #fde68a'}}>
            {it.type||'Consignee'}
          </span>
        </div>
      ))}
    </div>
    {modal&&<div className="ov"><div className="modal">
      <div className="mh"><span className="mt">Add {type==='retailers'?'Retailer':'Site'}</span>
        <button className="btn bgh bsm" onClick={()=>setModal(false)}>X</button>
      </div>
      <div className="mb">
        {type==='retailers'&&<div className="r2" style={{marginBottom:4}}>
          <div className="fg"><label>Type</label>
            <select value={rtype} onChange={e=>setRtype(e.target.value)}>
              <option value="Consignee">Consignee (unregistered)</option>
              <option value="Authorized">Authorized Retailer</option>
            </select>
          </div>
          <div className="fg"><label>{rtype==='Consignee'?'Auto Code':'Retailer Code'}</label>
            <input value={rtype==='Consignee'?nextConsigneeCode(user.id,d.retailers||[]):''}
              readOnly={rtype==='Consignee'}
              placeholder={rtype==='Authorized'?'09060R0284':''}

              onChange={()=>{}}/>

        </div>}
        <div className="r2">
          <div className="fg"><label>{type==='retailers'?'Shop Name':'Site Name'}</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Full registered name"/>
          </div>
          {type==='retailers'&&<div className="fg"><label>Alias / Known As</label>
            <input value={alias} onChange={e=>setAlias(e.target.value)} placeholder="e.g. Shyamu ji"/>
          </div>}
        </div>
        {type==='retailers'&&<div className="fg"><label>Phone</label>
          <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Mobile number"/>
        </div>}
        <div style={{fontSize:11,fontWeight:600,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.04em',marginBottom:6,marginTop:4}}>Delivery Location</div>
        <LocationPicker locationData={locationData||[]} value={loc} onChange={setLoc}/>
      </div>

        <button className="btn bgh" onClick={()=>setModal(false)}>Cancel</button>

      </div>
    </div></div>}
  </>;
}



// ══════════════════════════════════════════════
//  DISPATCH REPORT
// ══════════════════════════════════════════════
function DispatchReport({user,myOrders}){
  const today = new Date();
  today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  const lastWeekStart = new Date(today); lastWeekStart.setDate(lastWeekStart.getDate()-6);
  const lastMonthStart = new Date(today); lastMonthStart.setMonth(lastMonthStart.getMonth()-1);
  const thisMonthStart = new Date(today.getFullYear(), today.getMonth(), 1);

  const[period,setPeriod]=useState('all');
  const[dispType,setDispType]=useState('all');
  const[destType,setDestType]=useState('all');
  const[search,setSearch]=useState('');

  const periodFilter=(o)=>{
    const d=new Date(o.dispatchedAt||o.placedAt);
    d.setHours(0,0,0,0);
    if(period==='today')     return d.getTime()===today.getTime();
    if(period==='yesterday') return d.getTime()===yesterday.getTime();
    if(period==='week')      return d>=lastWeekStart&&d<=today;
    if(period==='thismonth') return d>=thisMonthStart&&d<=today;
    if(period==='lastmonth'){
      const lms=new Date(today.getFullYear(),today.getMonth()-1,1);
      const lme=new Date(today.getFullYear(),today.getMonth(),0);
      return d>=lms&&d<=lme;
    }
    return true;
  };

  const dispatched=myOrders.filter(o=>(o.status==='dispatched'||o.status==='closed'||o.status==='receiving_disputed'||o.status==='return_pending')&&periodFilter(o));

  const filtered=dispatched.filter(o=>{
    if(dispType!=='all'&&o.type!==dispType) return false;
    if(destType!=='all'&&o.destination!==destType) return false;
    if(search){
      const q=search.toLowerCase();
      return o.dealerName.toLowerCase().includes(q)||
             o.destName.toLowerCase().includes(q)||
             (o.challanRef||o.challanId||'').toLowerCase().includes(q);
    }
    return true;
  });

  // Summary stats
  const totalBagsAll=filtered.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(parseInt(i.qty)||0),0),0);
  const byType={FOR:0,EX:0};
  const byDest={Counter:0,Retailer:0,Site:0};
  const byCement={};
  filtered.forEach(o=>{
    byType[o.type]=(byType[o.type]||0)+1;
    byDest[o.destination]=(byDest[o.destination]||0)+1;
    o.items.forEach(i=>{
      byCement[i.cement]=(byCement[i.cement]||0)+(parseInt(i.qty)||0);
    });
  });

  const periods=[
    {id:'today',lb:'Today'},
    {id:'yesterday',lb:'Yesterday'},
    {id:'week',lb:'Last 7 Days'},
    {id:'thismonth',lb:'This Month'},
    {id:'lastmonth',lb:'Last Month'},
    {id:'all',lb:'All Time'},
  ];

  return <>
    <div className="ph">
      <div><div className="pt">Dispatch Report</div>
        <div className="ps">{filtered.length} orders · {totalBagsAll} bags dispatched</div>
      </div>
    </div>
    <div className="pb">
      {/* Period selector */}
      <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        {periods.map(p=>(
          <button key={p.id} className={`btn bsm ${period===p.id?'bam':'bgh'}`} onClick={()=>setPeriod(p.id)}>{p.lb}</button>
        ))}
      </div>

      {/* Summary cards */}
      <div className="sg" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:16}}>
        <div className="sc"><div className="sv">{filtered.length}</div><div className="sl">Total Orders</div></div>
        <div className="sc"><div className="sv" style={{color:'#16a34a'}}>{totalBagsAll}</div><div className="sl">Total Bags</div></div>
        <div className="sc"><div className="sv" style={{color:'#2563eb'}}>{byType.FOR||0}</div><div className="sl">FOR Orders</div></div>
        <div className="sc"><div className="sv" style={{color:'#d97706'}}>{byType.EX||0}</div><div className="sl">EX Orders</div></div>
      </div>

      {/* Cement-wise summary */}
      {Object.keys(byCement).length>0&&<div className="card" style={{marginBottom:16}}>
        <div className="ch"><span className="ct">Cement-wise Dispatch</span></div>
        <div className="cb">
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {Object.entries(byCement).sort((a,b)=>b[1]-a[1]).map(([cement,bags])=>(
              <div key={cement} style={{background:'#f9fafb',border:'1.5px solid #e5e7eb',borderRadius:8,padding:'8px 14px',textAlign:'center',minWidth:100}}>
                <div style={{fontSize:18,fontWeight:800,color:'#d97706'}}>{bags}</div>
                <div style={{fontSize:11,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.04em'}}>{cement}</div>
              </div>
            ))}
          </div>
        </div>
      </div>}

      {/* Filters */}
      <div className="card" style={{marginBottom:16}}>
        <div className="ch"><span className="ct">Filters</span></div>
        <div className="cb">
          <div className="r3">
            <div className="fg"><label>Dispatch Type</label>
              <select value={dispType} onChange={e=>setDispType(e.target.value)}>
                <option value="all">All</option>
                <option value="FOR">FOR only</option>
                <option value="EX">EX only</option>
              </select>
            </div>
            <div className="fg"><label>Destination Type</label>
              <select value={destType} onChange={e=>setDestType(e.target.value)}>
                <option value="all">All</option>
                <option value="Counter">Counter</option>
                <option value="Retailer">Retailer</option>
                <option value="Site">Site</option>
              </select>
            </div>
            <div className="fg"><label>Search dealer / destination</label>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Type to search..."/>
            </div>
          </div>
        </div>
      </div>

      {/* Orders table */}
      <div className="card">
        <div className="ch">
          <span className="ct">Order Details</span>
          <span style={{fontSize:12,color:'#6b7280'}}>{filtered.length} orders shown</span>
        </div>
        {filtered.length===0
          ?<div className="empty"><div className="empty-i">📋</div>No dispatched orders for this period. Try All Time, or dispatch an order by uploading the signed challan first.</div>
          :<>
          <div className="mobile-report">{filtered.map(o=>{const bags={};o.items.forEach(i=>bags[i.cement]=(parseInt(i.qty)||0));const total=Object.values(bags).reduce((s,v)=>s+v,0);return <div key={o.id} className="report-card"><div style={{display:'flex',justifyContent:'space-between',gap:8,marginBottom:6}}><strong style={{color:'#d97706'}}>{o.challanRef||o.challanId||o.id}</strong><span className={`badge ${sCls(o.status)}`}>{sLabel(o.status).split('–')[0]}</span></div><div style={{fontSize:12,color:'#374151',marginBottom:5}}>{o.dealerName} → {o.destName}</div><div style={{fontSize:12,color:'#6b7280',marginBottom:7}}>{o.type} · {fmtD(o.dispatchedAt||o.placedAt)} · {o.vehicle?o.vehicle.number:'-'}</div>{['Champion','Plus','Duratech','All Weather','NFR','OPC'].filter(c=>bags[c]).map(c=><div key={c} className="report-line"><span>{c}</span><strong>{bags[c]} bags</strong></div>)}<div className="report-line" style={{borderTop:'1.5px solid #e5e7eb',marginTop:4}}><span>Total</span><strong style={{color:'#111827'}}>{total} bags</strong></div>{(o.challanPhotoUrl||o.receivingDealerUrl||o.receivingLogisticsUrl)&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>{o.challanPhotoUrl&&<a className="btn bbl bsm" href={o.challanPhotoUrl} target="_blank">Challan</a>}{o.receivingDealerUrl&&<a className="btn bgr bsm" href={o.receivingDealerUrl} target="_blank">Dealer RCV</a>}{o.receivingLogisticsUrl&&<a className="btn bam bsm" href={o.receivingLogisticsUrl} target="_blank">WH RCV</a>}</div>}</div>})}</div>
          <div className="tw desktop-report">
            <table className="tbl">
              <thead>
                <tr>
                  <th>Challan Ref</th>
                  <th>Date</th>
                  <th>Dealer</th>
                  <th>Destination</th>
                  <th>Type</th>
                  <th>Champion</th>
                  <th>Plus</th>
                  <th>Duratech</th>
                  <th>All Weather</th>
                  <th>NFR</th>
                  <th>OPC</th>
                  <th>Total Bags</th>
                  <th>Vehicle</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(o=>{
                  const bags={};
                  o.items.forEach(i=>bags[i.cement]=(parseInt(i.qty)||0));
                  const total=Object.values(bags).reduce((s,v)=>s+v,0);
                  return(
                    <tr key={o.id}>
                      <td style={{color:'#d97706',fontWeight:600,fontSize:12}}>{o.challanRef||o.challanId||o.id}</td>

                      <td style={{fontSize:12}}>{o.dealerName}</td>
                      <td style={{fontSize:12}}>{o.destName}</td>
                      <td><span className="chip" style={{fontSize:10}}>{o.type}</span></td>
                      <td style={{textAlign:'center',fontWeight:600,color:bags['Champion']?'#d97706':'#d1d5db'}}>{bags['Champion']||'-'}</td>
                      <td style={{textAlign:'center',fontWeight:600,color:bags['Plus']?'#d97706':'#d1d5db'}}>{bags['Plus']||'-'}</td>
                      <td style={{textAlign:'center',fontWeight:600,color:bags['Duratech']?'#d97706':'#d1d5db'}}>{bags['Duratech']||'-'}</td>
                      <td style={{textAlign:'center',fontWeight:600,color:bags['All Weather']?'#d97706':'#d1d5db'}}>{bags['All Weather']||'-'}</td>
                      <td style={{textAlign:'center',fontWeight:600,color:bags['NFR']?'#d97706':'#d1d5db'}}>{bags['NFR']||'-'}</td>
                      <td style={{textAlign:'center',fontWeight:600,color:bags['OPC']?'#d97706':'#d1d5db'}}>{bags['OPC']||'-'}</td>
                      <td style={{textAlign:'center',fontWeight:800,color:'#111827'}}>{total}</td>
                      <td style={{fontSize:11,color:'#6b7280'}}>{o.vehicle?o.vehicle.number:'-'}</td>
                      <td><span className={`badge ${o.status==='closed'?'bcl':'bdi'}`} style={{fontSize:10}}>{o.status==='closed'?'Closed':'Dispatched'}</span></td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{background:'#fffbeb',borderTop:'2px solid #fde68a'}}>
                  <td colSpan={5} style={{fontWeight:700,color:'#111827',padding:'10px 12px'}}>TOTAL</td>
                  {['Champion','Plus','Duratech','All Weather','NFR','OPC'].map(cem=>{
                    const t=filtered.reduce((s,o)=>{
                      const it=o.items.find(i=>i.cement===cem);
                      return s+(it?parseInt(it.qty)||0:0);
                    },0);
                    return <td key={cem} style={{textAlign:'center',fontWeight:800,color:t?'#d97706':'#9ca3af',padding:'10px 12px'}}>{t||'-'}</td>;
                  })}
                  <td style={{textAlign:'center',fontWeight:800,color:'#111827',padding:'10px 12px'}}>{totalBagsAll}</td>
                  <td colSpan={2}></td>
                </tr>
              </tfoot>
            </table>
          </div></>
        }
      </div>
    </div>
  </>;
}

function TSEApprove({user,orders,setOrders,myOrders,warehouses}){
  const pending=myOrders.filter(o=>o.status==='placed');
  const act=async(id,newStatus)=>{
    try{await api('updateOrderStatus',{orderId:id,status:newStatus,changedBy:user.email});}
    catch(e){if(!demoFallback(e,()=>{}))return;}
    setOrders(orders.map(o=>o.id===id?{...o,status:newStatus,approvedAt:new Date().toISOString()}:o));
  };
  return <>
    <div className="ph"><div className="pt">Approve Orders</div><div className="ps">{pending.length} order(s) awaiting your approval</div></div>
    <div className="pb">
      {pending.length===0&&<div className="card"><div className="empty"><div className="empty-i">✅</div>All orders reviewed!</div></div>}
      {pending.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#d97706'}}>{o.id}</strong>
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <div style={{display:'flex',gap:7}}>
              <button className="btn brd bsm" onClick={()=>act(o.id,'closed')}>✕ Reject</button>
              <button className="btn bgr bsm" onClick={()=>act(o.id,'approved')}>✓ Approve</button>
            </div>
          </div>
          <div className="cb"><OInfo o={o} warehouses={warehouses}/></div>
        </div>
      ))}
    </div>
  </>;
}

function WHVehicle({user,orders,setOrders,myOrders,warehouses,vehicles,drivers}){
  const list=myOrders.filter(o=>o.status==='approved');
  const[sel,setSel]=useState(null);
  const[manualNo,setManualNo]=useState('');
  const[vNum,setVNum]=useState('');
  const[driver,setDriver]=useState('');
  const[vehicleId,setVehicleId]=useState('');
  const[driverId,setDriverId]=useState('');
  const[dPhone,setDPhone]=useState('');
  const[saving,setSaving]=useState(false);

  const assign=async()=>{
    if(!manualNo.trim()){alert('Enter the physical challan number from bilty');return;}
    if(!vNum.trim()||!driver.trim()){alert('Fill vehicle number and driver name');return;}
    const challanId='CH'+Date.now().toString().slice(-5);
    const selOrd=orders.find(o=>o.id===sel);
    const challanRef=manualNo.trim()+'/'+whName(selOrd?.warehouse||'',warehouses)+'/'+new Date().toLocaleDateString('en-IN');
    const upd={status:'vehicle_found',vehicleAt:new Date().toISOString(),challanId,challanRef,manualChallanNo:manualNo.trim(),vehicle:{number:vNum.trim(),driver:driver.trim(),phone:dPhone.trim()}};
    setSaving(true);
    try{await api('assignVehicle',{orderId:sel,vehicle:{number:vNum.trim(),driver:driver.trim(),phone:dPhone.trim(),vehicleId,driverId},assignedBy:user.email,manualChallanNo:manualNo.trim(),challanRef});}
    catch(e){if(!demoFallback(e,()=>{})){setSaving(false);return;}}
    setOrders(orders.map(o=>o.id===sel?{...o,...upd}:o));
    setSaving(false);setSel(null);setManualNo('');setVNum('');setDriver('');setDPhone('');
  };

  return <>
    <div className="ph"><div className="pt">Assign Vehicle</div><div className="ps">{list.length} order(s) looking for vehicle</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">🚛</div>No orders awaiting vehicle</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#d97706'}}>{o.id}</strong>
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <button className="btn bam bsm" onClick={()=>setSel(o.id)}>Assign Vehicle</button>
          </div>
          <div className="cb"><OInfo o={o} warehouses={warehouses}/></div>
        </div>
      ))}
    </div>
    {sel&&<div className="ov"><div className="modal">
      <div className="mh"><span className="mt">Assign Vehicle & Create Challan</span><button className="btn bgh bsm" onClick={()=>setSel(null)}>✕</button></div>
      <div className="mb">
        <div className="r2"><div className="fg"><label>Select Saved Vehicle</label><select value={vehicleId} onChange={e=>{const id=e.target.value;setVehicleId(id);const v=(vehicles||[]).find(x=>x.VehicleID===id);if(v){setVNum(v.VehicleNumber||'');setDriver(v.DriverName||'');setDPhone(v.DriverPhone||v.Mobile||'');}}}><option value="">Manual / New Vehicle</option>{(vehicles||[]).filter(v=>(v.IsActive||'TRUE')==='TRUE').map(v=><option key={v.VehicleID} value={v.VehicleID}>{v.VehicleNumber} · {v.DriverName||''}</option>)}</select></div><div className="fg"><label>Select Saved Driver</label><select value={driverId} onChange={e=>{const id=e.target.value;setDriverId(id);const d=(drivers||[]).find(x=>x.DriverID===id);if(d){setDriver(d.DriverName||'');setDPhone(d.Mobile||'');}}}><option value="">Manual / New Driver</option>{(drivers||[]).filter(d=>(d.IsActive||'TRUE')==='TRUE').map(d=><option key={d.DriverID} value={d.DriverID}>{d.DriverName} · {d.Mobile||''}</option>)}</select></div></div>
        <div className="fg"><label>Physical Challan Number (from bilty book) *</label>
          <input value={manualNo} onChange={e=>setManualNo(e.target.value)} placeholder="e.g. 2827"/>
        </div>
        <div className="fg"><label>Vehicle Number</label><input value={vNum} onChange={e=>setVNum(e.target.value)} placeholder="UP65AB1234"/></div>
        <div className="r2">
          <div className="fg"><label>Driver Name</label><input value={driver} onChange={e=>setDriver(e.target.value)} placeholder="Full name"/></div>
          <div className="fg"><label>Driver Phone</label><input value={dPhone} onChange={e=>setDPhone(e.target.value)} placeholder="Mobile number"/></div>
        </div>
        {manualNo&&<div className="alert ai"><span>Challan Ref:</span> <strong>{manualNo}/{whName(orders.find(o=>o.id===sel)?.warehouse||'', warehouses)}/{new Date().toLocaleDateString('en-IN')}</strong></div>}
      </div>
      <div className="mf"><button className="btn bgh" onClick={()=>setSel(null)}>Cancel</button><button className="btn bam" onClick={assign} disabled={saving}>{saving?<><span className="spin"/> Saving…</>:'Save & Create Challan'}</button></div>
    </div></div>}
  </>;
}

function WHLoading({user,orders,setOrders,myOrders,warehouses}){
  const list=myOrders.filter(o=>o.status==='vehicle_found');
  const[dispId,setDispId]=useState(null);
  const dispatch=async(file)=>{
    if(!file){alert('Please choose the signed challan photo/PDF first');return;}
    const ord=orders.find(o=>o.id===dispId);
    try{
      const photoData=await fileToDataUrl(file);
      const res0=await api('uploadChallanPhoto',{orderId:dispId,challanId:ord?.challanId||'',manualChallanNo:ord?.manualChallanNo||ord?.challanId||dispId,warehouseName:whName(ord?.warehouse||'',warehouses),uploadedBy:user.email,fileExt:safeFileExt(file),photoData});
      const res=await verifyUploadAfterResponse(res0,user,dispId,o=>!!(o.challanPhotoUrl||o.status==='dispatched'),setOrders);
      if(res.verified){ setDispId(null); return; }
      setOrders(orders.map(o=>o.id===dispId?{...o,status:'dispatched',dispatchedAt:new Date().toISOString(),challanPhotoUrl:res.url||o.challanPhotoUrl}:o));
    }catch(e){if(!demoFallback(e,()=>{})){alert('Upload failed: '+e.message);return;}}
    setDispId(null);
  };
  return <>
    <div className="ph"><div className="pt">Currently Loading</div><div className="ps">{list.length} vehicle(s) being loaded</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">📦</div>No loading in progress</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#d97706'}}>{o.id}</strong>
              {(o.challanRef||o.challanId)&&<span className="chip">Challan: {o.challanRef||o.challanId}</span>}
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <button className="btn bam bsm" onClick={()=>setDispId(o.id)}>📷 Upload Challan & Dispatch</button>
          </div>
          <div className="cb"><OInfo o={o} warehouses={warehouses}/></div>
        </div>
      ))}
    </div>
    {dispId&&<UploadModal title="Upload Signed Delivery Challan" subtitle="Photograph the hand-written challan before dispatching the vehicle. This will be saved in Google Drive under this warehouse." onClose={()=>setDispId(null)} onSave={dispatch}/>}
  </>;
}

function WHReceiving({user,orders,setOrders,myOrders,warehouses}){
  const list=myOrders.filter(o=>o.status==='dispatched'&&!o.logisticsReceivingUploaded);
  const[upId,setUpId]=useState(null);
  const[remarks,setRemarks]=useState('');
  const mark=async(file)=>{
    if(!file){alert('Please choose the receiving photo/PDF first');return;}
    const ord=orders.find(o=>o.id===upId);
    try{
      const photoData=await fileToDataUrl(file);
      const res0=await api('uploadReceivingPhoto',{orderId:upId,challanId:ord?.challanId||'',manualChallanNo:ord?.manualChallanNo||ord?.challanId||upId,warehouseName:whName(ord?.warehouse||'',warehouses),uploadedBy:user.email,uploaderRole:'logistics',remarks,fileExt:safeFileExt(file),photoData});
      const res=await verifyUploadAfterResponse(res0,user,upId,o=>!!(o.receivingLogisticsUrl||o.logisticsReceivingUploaded),setOrders);
      if(res.verified){ setUpId(null); setRemarks(''); return; }
      const upd={logisticsReceivingUploaded:true,receivingLogisticsUrl:res.url||ord?.receivingLogisticsUrl||'',receivingUploaded:true,status:(ord?.dealerReceivingUploaded?'closed':ord?.status),remarks:remarks||ord?.remarks};
      setOrders(orders.map(o=>o.id===upId?{...o,...upd}:o));
    }catch(e){if(!demoFallback(e,()=>{})){alert('Upload failed: '+e.message);return;}}
    setUpId(null);setRemarks('');
  };
  return <>
    <div className="ph"><div className="pt">Upload Receiving</div><div className="ps">Challans pending receiving confirmation</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">✅</div>All receivings uploaded!</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#d97706'}}>{o.id}</strong>
              {(o.challanRef||o.challanId)&&<span className="chip">Challan: {o.challanRef||o.challanId}</span>}
            </div>
            <button className="btn bbl bsm" onClick={()=>setUpId(o.id)}>📷 Upload Receiving</button>
          </div>
          <div className="cb">
            <div style={{fontSize:13,color:'#374151',marginBottom:4}}>Dealer: <strong style={{color:'#374151'}}>{o.dealerName}</strong> · {o.destination}: {o.destName}</div>
            {o.vehicle&&<div style={{fontSize:12,color:'#6b7280'}}>🚛 {o.vehicle.number} · {o.vehicle.driver} · {o.vehicle.phone}</div>}
            <div style={{fontSize:12,color:'#dc2626',marginTop:7}}>⚠ Must upload within 24 hours of dispatch</div>
          </div>
        </div>
      ))}
    </div>
    {upId&&<UploadModal title="Upload Receiving" subtitle="Scan or photograph the returned delivery challan" onClose={()=>{setUpId(null);setRemarks('');}} onSave={mark} showRemarks={true} remarks={remarks} setRemarks={setRemarks}/>}
  </>;
}

// ══════════════════════════════════════════════
function AdminOrders({myOrders,warehouses}){
  const[filter,setFilter]=useState('all');
  const[search,setSearch]=useState('');
  const filtered=myOrders.filter(o=>{
    if(filter!=='all'&&o.status!==filter) return false;
    if(search&&!o.dealerName.toLowerCase().includes(search.toLowerCase())&&!o.id.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  const counts={all:myOrders.length};
  myOrders.forEach(o=>{counts[o.status]=(counts[o.status]||0)+1;});

  return <>
    <div className="ph"><div className="pt">All Orders</div><div className="ps">{myOrders.length} total across all territories</div></div>
    <div className="pb">
      <div className="sg">
        <div className="sc"><div className="sv">{counts.placed||0}</div><div className="sl">Awaiting Approval</div></div>
        <div className="sc"><div className="sv" style={{color:'#16a34a'}}>{counts.approved||0}</div><div className="sl">Looking for Vehicle</div></div>
        <div className="sc"><div className="sv" style={{color:'#ea580c'}}>{counts.vehicle_found||0}</div><div className="sl">Loading</div></div>
        <div className="sc"><div className="sv" style={{color:'#7c3aed'}}>{counts.dispatched||0}</div><div className="sl">Dispatched</div></div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        {['all','placed','approved','vehicle_found','dispatched','closed'].map(s=>(
          <button key={s} className={`btn ${filter===s?'bam':'bgh'} bsm`} onClick={()=>setFilter(s)}>
            {s==='all'?'All':sLabel(s).split('–')[0].trim()}
          </button>
        ))}
      </div>
      <div className="fg"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by dealer name or order ID…"/></div>
      {filtered.length===0&&<div className="card"><div className="empty"><div className="empty-i">📋</div>No orders match</div></div>}
      {filtered.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#d97706'}}>{o.id}</strong>
              <span className="chip">{o.territory}</span>
              {(o.challanRef||o.challanId)&&<span className="chip">Challan: {o.challanRef||o.challanId}</span>}
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <span style={{fontSize:12,color:'#6b7280'}}>{fmtD(o.placedAt)}</span>
          </div>
          <div className="cb"><OInfo o={o} warehouses={warehouses}/></div>
        </div>
      ))}
    </div>
  </>;
}

      {pending.length>0&&<div className="alert aw"><span>⚠️</span><strong>{pending.length} challan(s)</strong> have not been received yet. Dealers and logistics managers have been reminded.</div>}
      {pending.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">

              <strong style={{color:'#d97706'}}>{o.id}</strong>
              <span className="chip">{o.territory}</span>
              {(o.challanRef||o.challanId)&&<span className="chip">Challan: {o.challanRef||o.challanId}</span>}

function ItemReceivingModal({order,title,subtitle,onClose,onSave}){
  const[file,setFile]=useState(null);
  const[remarks,setRemarks]=useState('');
  const[busy,setBusy]=useState(false);
  const[rows,setRows]=useState((order.items||[]).map(i=>({cement:i.cement,dispatchedQty:parseInt(i.qty)||0,goodQty:parseInt(i.qty)||0,shortQty:0,damagedQty:0,returnedQty:0,reason:''})));
  const setVal=(idx,k,v)=>setRows(rows.map((r,i)=>i===idx?{...r,[k]:v}:r));
  const claimTotal=rows.reduce((s,r)=>s+(parseInt(r.shortQty)||0)+(parseInt(r.damagedQty)||0)+(parseInt(r.returnedQty)||0),0);
  const save=async()=>{setBusy(true);try{await onSave(file,rows,remarks);}finally{setBusy(false);}};
  return <div className="ov"><div className="modal" style={{width:720}}>
    <div className="mh"><span className="mt">{title}</span><button className="btn bgh bsm" onClick={onClose}>✕</button></div>
    <div className="mb">
      {subtitle&&<div style={{fontSize:13,color:'#6b7280',marginBottom:12}}>{subtitle}</div>}
      <div className="uz"><input type="file" accept="image/*,.pdf" onChange={e=>setFile(e.target.files[0])}/><div style={{fontSize:28,marginBottom:6}}>📎</div>{file?<div style={{fontSize:13}}><strong style={{color:'#d97706'}}>{file.name}</strong><br/><span style={{color:'#6b7280',fontSize:12}}>{(file.size/1024).toFixed(1)} KB</span></div>:<div style={{fontSize:13,color:'#6b7280'}}><strong style={{color:'#d97706'}}>Tap to choose receiving photo</strong><br/>JPG, PNG, or PDF</div>}</div>
      <div style={{fontSize:11,fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.04em',margin:'12px 0 6px'}}>Item-wise Receiving</div>
      <div className="claim-grid" style={{fontSize:11,color:'#6b7280',fontWeight:700,marginBottom:4}}><div>Item</div><div>Good</div><div>Short</div><div>Damaged</div><div>Returned</div></div>
      {rows.map((r,idx)=><div key={r.cement} className="claim-grid" style={{marginBottom:6}}><div style={{fontSize:12}}><strong>{r.cement}</strong><br/><span style={{color:'#6b7280'}}>Dispatched {r.dispatchedQty}</span></div><input type="number" min="0" value={r.goodQty} onChange={e=>setVal(idx,'goodQty',e.target.value)}/><input type="number" min="0" value={r.shortQty} onChange={e=>setVal(idx,'shortQty',e.target.value)}/><input type="number" min="0" value={r.damagedQty} onChange={e=>setVal(idx,'damagedQty',e.target.value)}/><input type="number" min="0" value={r.returnedQty} onChange={e=>setVal(idx,'returnedQty',e.target.value)}/></div>)}
      {claimTotal>0&&<div className="alert aw"><span>⚠️</span><div>Claimed shortage/return: <strong>{claimTotal} bags</strong>. This will go to logistics for approval. Credit will not be created automatically.</div></div>}
      <div className="fg" style={{marginTop:10}}><label>Remarks / reason</label><textarea value={remarks} onChange={e=>setRemarks(e.target.value)} placeholder="Example: 5 bags damaged, 2 bags short delivered..."/></div>
    </div>
    <div className="mf"><button className="btn bgh" onClick={onClose}>Cancel</button><button className="btn bam" onClick={save} disabled={busy}>{busy?<><span className="spin"/> Uploading…</>:'Submit Receiving ✓'}</button></div>
  </div></div>;
}

function WHReturnApproval({user,orders,setOrders,myOrders,warehouses}){
  const list=myOrders.filter(o=>o.status==='receiving_disputed'||o.status==='return_pending');
  const[sel,setSel]=useState(null);
  const[decisions,setDecisions]=useState({});
  const[remarks,setRemarks]=useState('');
  const selected=orders.find(o=>o.id===sel);
  const claimItems=(selected?.receivingItems||[]).filter(i=>i.claimQty>0);
  const approve=async()=>{
    if(!selected)return;
    const ds=claimItems.map(i=>({cement:i.cement,approvedQty:parseInt(decisions[i.cement]??i.claimQty)||0,remarks}));
    try{await api('approveReceivingClaim',{orderId:selected.id,challanId:selected.challanId||'',approvedBy:user.email,remarks,decisions:ds});}
    catch(e){alert('Approval failed: '+e.message);return;}
    setOrders(orders.map(o=>o.id===selected.id?{...o,status:ds.some(d=>d.approvedQty>0)?'return_pending':'closed',creditStatus:'Approved'}:o));
    setSel(null);setDecisions({});setRemarks('');
  };
  const closeReturn=async(o)=>{try{await api('confirmReturnReceived',{orderId:o.id,challanId:o.challanId||'',receivedBy:user.email,remarks:'Returned bags received at warehouse'});}catch(e){alert('Return close failed: '+e.message);return;}setOrders(orders.map(x=>x.id===o.id?{...x,status:'closed',returnStatus:'Return Received'}:x));};
  return <><div className="ph"><div className="pt">Return / Credit Approval</div><div className="ps">Credit is created only after logistics approval</div></div><div className="pb">{list.length===0&&<div className="card"><div className="empty"><div className="empty-i">✅</div>No disputed receivings or pending returns</div></div>}{list.map(o=><div key={o.id} className="card"><div className="ch"><div><strong style={{color:'#d97706'}}>{o.id}</strong> <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span></div><div style={{display:'flex',gap:6}}>{o.status==='receiving_disputed'&&<button className="btn bam bsm" onClick={()=>setSel(o.id)}>Review Claim</button>}{o.status==='return_pending'&&<button className="btn bgr bsm" onClick={()=>closeReturn(o)}>Confirm Return Received</button>}</div></div><div className="cb"><OInfo o={o} warehouses={warehouses}/>{(o.receivingItems||[]).filter(i=>i.claimQty>0).map(i=><div key={i.id||i.cement} className="alert aw" style={{marginTop:8}}><span>Claim</span><span>{i.cement}: Short {i.shortQty}, Damaged {i.damagedQty}, Returned {i.returnedQty} · Status: {i.claimStatus}</span></div>)}</div></div>)}</div>{sel&&selected&&<div className="ov"><div className="modal" style={{width:680}}><div className="mh"><span className="mt">Approve Receiving Claim</span><button className="btn bgh bsm" onClick={()=>setSel(null)}>✕</button></div><div className="mb"><OInfo o={selected} warehouses={warehouses}/><div style={{marginTop:12}}>{claimItems.map(i=><div key={i.cement} className="cr"><span className="cn">{i.cement}<br/><span style={{fontSize:11,color:'#6b7280'}}>Claim {i.claimQty} bags</span></span><span style={{fontSize:11,color:'#6b7280'}}>Approved Qty</span><input className="ci" type="number" min="0" max={i.claimQty} value={decisions[i.cement]??i.claimQty} onChange={e=>setDecisions({...decisions,[i.cement]:e.target.value})}/></div>)}</div><div className="fg"><label>Logistics remarks</label><textarea value={remarks} onChange={e=>setRemarks(e.target.value)} placeholder="Reason for approval/rejection"/></div></div><div className="mf"><button className="btn bgh" onClick={()=>setSel(null)}>Cancel</button><button className="btn bam" onClick={approve}>Approve Selected Qty</button></div></div></div>}</>;
}

function FleetManager({user,vehicles,setVehicles,drivers,setDrivers,warehouses}){
  const[mode,setMode]=useState('driver');
  const[name,setName]=useState('');const[phone,setPhone]=useState('');const[vnum,setVnum]=useState('');const[owner,setOwner]=useState('');const[cap,setCap]=useState('');const[wh,setWh]=useState(user.warehouse||'');
  const save=async()=>{try{if(mode==='driver'){const r=await api('addDriver',{driverName:name,mobile:phone,preferredWarehouse:wh,createdBy:user.email});setDrivers([...(drivers||[]),{DriverID:r.driverId,DriverName:name,Mobile:phone,PreferredWarehouse:wh,IsActive:'TRUE'}]);}else{const r=await api('addVehicle',{vehicleNumber:vnum,ownerName:owner,driverName:name,driverPhone:phone,capacityBags:cap,preferredWarehouse:wh,createdBy:user.email});setVehicles([...(vehicles||[]),{VehicleID:r.vehicleId,VehicleNumber:vnum,OwnerName:owner,DriverName:name,DriverPhone:phone,CapacityBags:cap,PreferredWarehouse:wh,IsActive:'TRUE'}]);}setName('');setPhone('');setVnum('');setOwner('');setCap('');}catch(e){alert('Save failed: '+e.message);}};
  return <><div className="ph"><div><div className="pt">Drivers & Vehicles</div><div className="ps">Onboard regular drivers and vehicles for faster challan creation</div></div></div><div className="pb"><div style={{display:'flex',gap:6,marginBottom:12}}><button className={`btn ${mode==='driver'?'bam':'bgh'}`} onClick={()=>setMode('driver')}>Add Driver</button><button className={`btn ${mode==='vehicle'?'bam':'bgh'}`} onClick={()=>setMode('vehicle')}>Add Vehicle</button></div><div className="card"><div className="ch"><span className="ct">{mode==='driver'?'New Driver':'New Vehicle'}</span></div><div className="cb">{mode==='vehicle'&&<div className="r2"><div className="fg"><label>Vehicle Number</label><input value={vnum} onChange={e=>setVnum(e.target.value.toUpperCase())}/></div><div className="fg"><label>Owner Name</label><input value={owner} onChange={e=>setOwner(e.target.value)}/></div></div>}<div className="r2"><div className="fg"><label>Driver Name</label><input value={name} onChange={e=>setName(e.target.value)}/></div><div className="fg"><label>Mobile</label><input value={phone} onChange={e=>setPhone(e.target.value)}/></div></div>{mode==='vehicle'&&<div className="fg"><label>Capacity Bags</label><input value={cap} onChange={e=>setCap(e.target.value)} type="number"/></div>}<div className="fg"><label>Preferred Warehouse</label><select value={wh} onChange={e=>setWh(e.target.value)}><option value="">All</option>{(warehouses||WHS).map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div><button className="btn bam" onClick={save}>Save</button></div></div><div className="r2"><div className="card"><div className="ch"><span className="ct">Drivers</span></div><div className="cb">{(drivers||[]).map(d=><div className="dc" key={d.DriverID}><div><strong>{d.DriverName}</strong><div style={{fontSize:12,color:'#6b7280'}}>{d.Mobile}</div></div><span className="chip">{d.PreferredWarehouse||'All'}</span></div>)}</div></div><div className="card"><div className="ch"><span className="ct">Vehicles</span></div><div className="cb">{(vehicles||[]).map(v=><div className="dc" key={v.VehicleID}><div><strong>{v.VehicleNumber}</strong><div style={{fontSize:12,color:'#6b7280'}}>{v.DriverName} · {v.DriverPhone}</div></div><span className="chip">{v.CapacityBags||'-'} bags</span></div>)}</div></div></div></div></>;
}

function OInfo({o,warehouses}){
  return(
    <div className="r2">
      <div>
        <div style={{fontSize:11,color:'#6b7280',marginBottom:5,textTransform:'uppercase',letterSpacing:'.04em'}}>Details</div>
        <div style={{fontWeight:600,color:'#374151',fontSize:14,marginBottom:2}}>{o.dealerName}</div>
        <div style={{fontSize:12,color:'#6b7280',marginBottom:2}}>📍 {o.destination}: {o.destName}</div>
        <div style={{fontSize:12,color:'#6b7280',marginBottom:2}}>🏭 {whName(o.warehouse, warehouses)}</div>
        <div style={{fontSize:12,color:'#6b7280'}}>🚚 <span className="chip">{o.type}</span></div>
        {o.vehicle&&<div style={{fontSize:12,color:'#6b7280',marginTop:5}}>🚛 {o.vehicle.number} · {o.vehicle.driver} · {o.vehicle.phone}</div>}
        {(o.challanPhotoUrl||o.receivingDealerUrl||o.receivingLogisticsUrl)&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
          {o.challanPhotoUrl&&<a className="btn bbl bsm" href={o.challanPhotoUrl} target="_blank" rel="noopener noreferrer">📄 View Challan</a>}
          {o.receivingDealerUrl&&<a className="btn bgr bsm" href={o.receivingDealerUrl} target="_blank" rel="noopener noreferrer">📷 Dealer Receiving</a>}
          {o.receivingLogisticsUrl&&<a className="btn bam bsm" href={o.receivingLogisticsUrl} target="_blank" rel="noopener noreferrer">📷 Warehouse Receiving</a>}
        </div>}
        {o.remarks&&<div style={{fontSize:12,color:'#d97706',marginTop:5}}>📝 {o.remarks}</div>}
      </div>
      <div>
        <div style={{fontSize:11,color:'#6b7280',marginBottom:5,textTransform:'uppercase',letterSpacing:'.04em'}}>Items</div>
        {o.items.map(i=>(
          <div key={i.cement} style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'#374151',marginBottom:3,paddingBottom:3,borderBottom:'1px solid #f3f4f6'}}>
            <span>#{i.seq} {i.cement}</span><span style={{color:'#d97706',fontWeight:700}}>{i.qty} bags</span>
          </div>
        ))}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginTop:4,paddingTop:4,borderTop:'1px solid #e5e7eb'}}>
          <span style={{color:'#6b7280'}}>Total</span>
          <span style={{color:'#d97706',fontWeight:700}}>{totalBags(o.items)} bags</span>
        </div>
      </div>
    </div>
  );
}

function UploadModal({title,subtitle,onClose,onSave,showRemarks,remarks,setRemarks}){
  const[file,setFile]=useState(null);
  const[busy,setBusy]=useState(false);
  const save=async()=>{setBusy(true);try{await onSave(file);}finally{setBusy(false);}};
  return(
    <div className="ov">
      <div className="modal">
        <div className="mh"><span className="mt">{title}</span><button className="btn bgh bsm" onClick={onClose}>✕</button></div>
        <div className="mb">
          {subtitle&&<div style={{fontSize:13,color:'#6b7280',marginBottom:12}}>{subtitle}</div>}
          <div className="uz">
            <input type="file" accept="image/*,.pdf" onChange={e=>setFile(e.target.files[0])}/>
            <div style={{fontSize:28,marginBottom:6}}>📎</div>
            {file?<div style={{fontSize:13}}><strong style={{color:'#d97706'}}>{file.name}</strong><br/><span style={{color:'#6b7280',fontSize:12}}>{(file.size/1024).toFixed(1)} KB</span></div>
            :<div style={{fontSize:13,color:'#6b7280'}}><strong style={{color:'#d97706'}}>Tap to choose file</strong> or drag & drop<br/>JPG, PNG, or PDF</div>}
          </div>
          {showRemarks&&<div className="fg" style={{marginTop:12}}>
            <label>Remarks (damaged / short goods? note here)</label>
            <textarea value={remarks} onChange={e=>setRemarks(e.target.value)} placeholder="e.g. 5 bags damaged, 2 bags short delivered…"/>
          </div>}
        </div>
        <div className="mf">
          <button className="btn bgh" onClick={onClose}>Cancel</button>
          <button className="btn bam" onClick={save} disabled={busy}>{busy?<><span className="spin"/> Uploading…</>:'Confirm Upload ✓'}</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
