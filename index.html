<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;

// ══════════════════════════════════════════════
//  ⚙️ CONFIG — edit these after deployment
// ══════════════════════════════════════════════
const CFG={
  SCRIPT_URL:"YOUR_APPS_SCRIPT_URL_HERE",
  DEMO_MODE:true, // set false after pasting your URL above
};

// ── Static data ────────────────────────────────
const CEMENTS=['Champion','Plus','Duratech','All Weather','NFR','OPC'];
const WHS=[
  {id:'WH1',name:'Ballia Central Warehouse'},
  {id:'WH2',name:'Ballia East Warehouse'},
  {id:'WH3',name:'Mau Main Warehouse'},
  {id:'WH4',name:'Mau North Warehouse'},
];
const DEMO_USERS={
  'tse1@novus.in':{role:'tse',name:'Ramesh Gupta',territory:'Ballia 1',email:'tse1@novus.in'},
  'tse2@novus.in':{role:'tse',name:'Sunita Verma',territory:'Ballia 2',email:'tse2@novus.in'},
  'tse3@novus.in':{role:'tse',name:'Anil Yadav',territory:'Mau',email:'tse3@novus.in'},
  'logistics1@novus.in':{role:'logistics',name:'Mohan Singh',warehouse:'WH1',email:'logistics1@novus.in'},
  'logistics2@novus.in':{role:'logistics',name:'Priya Sharma',warehouse:'WH2',email:'logistics2@novus.in'},
  'logistics3@novus.in':{role:'logistics',name:'Deepak Tiwari',warehouse:'WH3',email:'logistics3@novus.in'},
  'logistics4@novus.in':{role:'logistics',name:'Kavita Patel',warehouse:'WH4',email:'logistics4@novus.in'},
  'dealer1@novus.in':{role:'dealer',name:'Shyam Trading Co.',territory:'Ballia 1',id:'D001',email:'dealer1@novus.in'},
  'dealer2@novus.in':{role:'dealer',name:'Rajesh Cement Store',territory:'Ballia 1',id:'D002',email:'dealer2@novus.in'},
  'dealer3@novus.in':{role:'dealer',name:'Mau Building Supplies',territory:'Mau',id:'D003',email:'dealer3@novus.in'},
  'admin@novus.in':{role:'admin',name:'Branch Manager',territory:'All',email:'admin@novus.in'},
};
const DEMO_DEALERS={
  D001:{name:'Shyam Trading Co.',territory:'Ballia 1',
    retailers:[{id:'R001',name:'Karim Hardware',phone:'9000000010'},{id:'R002',name:'Ram Niwas Store',phone:'9000000011'}],
    sites:[{id:'S001',name:'Rampur Construction Site',address:'Rampur, Ballia'},{id:'S002',name:'Highway Bridge Project',address:'NH-28, Ballia'}]},
  D002:{name:'Rajesh Cement Store',territory:'Ballia 1',
    retailers:[{id:'R003',name:'Om Traders',phone:'9000000012'}],
    sites:[{id:'S003',name:'City Mall Construction',address:'Civil Lines, Ballia'}]},
  D003:{name:'Mau Building Supplies',territory:'Mau',
    retailers:[{id:'R004',name:'Shiv Hardware',phone:'9000000013'}],
    sites:[{id:'S004',name:'Government School Site',address:'Mau Town'}]},
};
const DEMO_ORDERS=[
  {id:'ORD001',dealer:'D001',dealerName:'Shyam Trading Co.',territory:'Ballia 1',warehouse:'WH1',type:'FOR',destination:'Counter',destName:'Shyam Trading Counter',items:[{cement:'Champion',qty:50,seq:1},{cement:'Plus',qty:30,seq:2}],status:'placed',placedAt:'2025-08-10T09:00:00',challanId:null,vehicle:null,receivingUploaded:false,remarks:''},
  {id:'ORD002',dealer:'D002',dealerName:'Rajesh Cement Store',territory:'Ballia 1',warehouse:'WH1',type:'EX',destination:'Site',destName:'City Mall Construction',items:[{cement:'Duratech',qty:100,seq:1}],status:'approved',placedAt:'2025-08-09T14:00:00',challanId:null,vehicle:null,receivingUploaded:false,remarks:''},
  {id:'ORD003',dealer:'D003',dealerName:'Mau Building Supplies',territory:'Mau',warehouse:'WH3',type:'FOR',destination:'Retailer',destName:'Shiv Hardware',items:[{cement:'OPC',qty:80,seq:1},{cement:'NFR',qty:40,seq:2}],status:'vehicle_found',placedAt:'2025-08-08T10:00:00',challanId:'CH003',vehicle:{number:'UP65AB1234',driver:'Ram Kumar',phone:'9876543210'},receivingUploaded:false,remarks:''},
  {id:'ORD004',dealer:'D001',dealerName:'Shyam Trading Co.',territory:'Ballia 1',warehouse:'WH2',type:'EX',destination:'Counter',destName:'Shyam Trading Counter',items:[{cement:'All Weather',qty:60,seq:1}],status:'dispatched',placedAt:'2025-08-07T09:00:00',challanId:'CH004',vehicle:{number:'UP32CD5678',driver:'Suresh Yadav',phone:'9123456780'},receivingUploaded:false,remarks:''},
];

// ── Helpers ────────────────────────────────────
function sLabel(s){return{placed:'Order Placed – Waiting for Approval',approved:'Order Approved – Looking for Vehicle',vehicle_found:'Vehicle Found – Loading Started',dispatched:'Loading Complete – Vehicle Dispatched',closed:'Order Closed'}[s]||s;}
function sCls(s){return{placed:'bp',approved:'ba',vehicle_found:'bv',dispatched:'bd',closed:'bcl'}[s]||'bp';}
function whName(id){return WHS.find(w=>w.id===id)?.name||id;}
function fmtD(d){try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch{return d;}}
function fmtDT(d){try{return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return d;}}
function totalBags(items){return items.reduce((s,i)=>s+(parseInt(i.qty)||0),0);}

// ── API ────────────────────────────────────────
function api(action, payload={}) {
  if(CFG.DEMO_MODE) return Promise.reject(new Error('DEMO_MODE'));
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now();
    const params = new URLSearchParams({action, ...flattenPayload(payload), callback: cbName});
    const script = document.createElement('script');
    script.src = CFG.SCRIPT_URL + '?' + params.toString();
    window[cbName] = (data) => {
      delete window[cbName];
      document.body.removeChild(script);
      if(data.error) reject(new Error(data.error));
      else resolve(data);
    };
    script.onerror = () => reject(new Error('Network error'));
    document.body.appendChild(script);
  });
}
function flattenPayload(obj, prefix='') {
  const result = {};
  for(const key in obj) {
    const val = obj[key];
    if(val !== null && typeof val === 'object' && !Array.isArray(val)) {
      Object.assign(result, flattenPayload(val, prefix+key+'_'));
    } else {
      result[prefix+key] = typeof val === 'object' ? JSON.stringify(val) : val;
    }
  }
  return result;
}
function demoFallback(e,fn){if(e.message==='DEMO_MODE'){fn();return true;}return false;}

// ══════════════════════════════════════════════
//  APP ROOT
// ══════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[orders,setOrders]=useState(DEMO_ORDERS);
  const[dealers,setDealers]=useState(DEMO_DEALERS);
  if(!user)return <Login setUser={setUser} setOrders={setOrders} setDealers={setDealers}/>;
  return <Shell user={user} setUser={setUser} orders={orders} setOrders={setOrders} dealers={dealers} setDealers={setDealers}/>;
}

// ══════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════
function Login({setUser,setOrders,setDealers}){
  const[email,setEmail]=useState('');
  const[pw,setPw]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);

  const go=async()=>{
    setErr('');setLoading(true);
    try{
      if(CFG.DEMO_MODE){
        const u=DEMO_USERS[email.toLowerCase().trim()];
        if(!u||pw!=='novus123'){setErr('Invalid credentials. Demo password: novus123');setLoading(false);return;}
        setUser({...u});
      } else {
        const d=await api('login',{email:email.toLowerCase().trim(),password:pw});
        setUser(d.user);
        const appData=await api('getAppData',{email:email.toLowerCase().trim()});
        if(appData.orders) setOrders(appData.orders);
        if(appData.dealers) setDealers(Object.fromEntries(appData.dealers.map(d=>[d.id,d])));
      }
    }catch(e){if(e.message!=='DEMO_MODE')setErr('Login failed: '+e.message);}
    setLoading(false);
  };

  return(
    <div className="lw">
      <div className="lc">
        <div className="brand">
          <div className="bi">N</div>
          <div><div className="bn">Novus Solutions</div><div className="bs">Ballia Branch · C&F Portal</div></div>
        </div>
        <h2>Sign in to your portal</h2>
        <p className="lsub">Enter your registered email and password</p>
        {err&&<div className="ebox">⚠ {err}</div>}
        {CFG.DEMO_MODE&&<div className="alert ai" style={{marginBottom:14}}><span>ℹ️</span><span><strong>Demo Mode</strong> — not yet connected to Google Sheets. Complete setup to go live.</span></div>}
        <div className="field"><label>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="yourname@novus.in" type="email" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <div className="field"><label>Password</label><input value={pw} onChange={e=>setPw(e.target.value)} type="password" placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <button className="btn-login" onClick={go} disabled={loading}>{loading?<><span className="spin"/> Signing in…</>:'Sign In →'}</button>
        <div className="hbox">
          <h4>Demo accounts (password: novus123)</h4>
          {Object.entries(DEMO_USERS).map(([e,u])=>(
            <div className="hr" key={e} onClick={()=>setEmail(e)}>
              <span className="he">{e}</span>
              <span className="hrl">{u.role==='tse'?`TSE·${u.territory.replace('Ballia ','B')}`:u.role==='logistics'?`WH·${u.warehouse||''}`:u.role==='admin'?'Admin':'Dealer'}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
//  SHELL
// ══════════════════════════════════════════════
function Shell({user,setUser,orders,setOrders,dealers,setDealers}){
  const[page,setPage]=useState('home');

  const myOrders=orders.filter(o=>{
    if(user.role==='dealer') return o.dealer===user.id;
    if(user.role==='tse')    return o.territory===user.territory;
    if(user.role==='logistics') return o.warehouse===user.warehouse;
    return true; // admin sees all
  });

  const navMap={

function Router({page,...p}){
  const{user}=p;
  if(page==='home') return <Dashboard {...p}/>;
  if(user.role==='dealer'){
    if(page==='place')    return <PlaceOrder {...p}/>;
    if(page==='pending')  return <DealerOrders {...p} filter={['placed','approved','vehicle_found','dispatched']} title="Pending Orders"/>;
    if(page==='closed')   return <DealerOrders {...p} filter={['closed']} title="Closed Orders"/>;
    if(page==='retailers')return <Contacts {...p} type="retailers"/>;
    if(page==='sites')    return <Contacts {...p} type="sites"/>;
  }
  if(user.role==='tse'){
    if(page==='dealers')  return <TSEDealers {...p}/>;
    if(page==='approve')  return <TSEApprove {...p}/>;
    if(page==='approved') return <OList {...p} filter={['approved']} title="Approved – Awaiting Dispatch"/>;
    if(page==='dispatched')return <OList {...p} filter={['dispatched','closed']} title="Dispatched Orders"/>;
  }
  if(user.role==='logistics'){
    if(page==='wh_pending')   return <OList {...p} filter={['placed']} title="Waiting for TSE Approval"/>;
    if(page==='wh_vehicle')   return <WHVehicle {...p}/>;
    if(page==='wh_loading')   return <WHLoading {...p}/>;
    if(page==='wh_dispatched')return <OList {...p} filter={['dispatched','closed']} title="Dispatched Orders"/>;
    if(page==='wh_receiving') return <WHReceiving {...p}/>;
  }
  if(user.role==='admin'){
    if(page==='admin_orders')  return <AdminOrders {...p}/>;
    if(page==='admin_dealers') return <AdminDealers {...p}/>;
    if(page==='admin_pending') return <AdminPending {...p}/>;
  }
  return <Dashboard {...p}/>;
}

function PlaceOrder({user,orders,setOrders,dealers}){
  const d=dealers[user.id];
  const[dest,setDest]=useState('counter');
  const[destId,setDestId]=useState('');
  const[wh,setWh]=useState('WH1');
  const[type,setType]=useState('FOR');
  const[items,setItems]=useState(CEMENTS.map(c=>({cement:c,qty:'',seq:''})));
  const[done,setDone]=useState(false);
  const[saving,setSaving]=useState(false);
  const blocked=orders.some(o=>o.dealer===user.id&&o.status==='dispatched'&&!o.receivingUploaded);
  const total=totalBags(items);

  const submit=async()=>{
    const sel=items.filter(i=>parseInt(i.qty)>0).map(i=>({cement:i.cement,qty:parseInt(i.qty),seq:parseInt(i.seq)||1}));
    if(!sel.length){alert('Add at least one cement item');return;}
    if((dest==='retailer'||dest==='site')&&!destId){alert('Please select a destination');return;}
    const destName=dest==='counter'?d.name:dest==='retailer'?d.retailers.find(r=>r.id===destId)?.name:d.sites.find(s=>s.id===destId)?.name;
    const o={id:'ORD'+Date.now().toString().slice(-6),dealer:user.id,dealerName:user.name,territory:user.territory,warehouse:wh,type,destination:dest==='counter'?'Counter':dest==='retailer'?'Retailer':'Site',destName,items:sel,status:'placed',placedAt:new Date().toISOString(),challanId:null,vehicle:null,receivingUploaded:false,remarks:''};
    setSaving(true);
    try{await api('addOrder',{order:o,items:sel});}catch(e){if(!demoFallback(e,()=>{})){alert('Error: '+e.message);setSaving(false);return;}}
    setOrders(prev=>[...prev,o]);
    setDone(true);setSaving(false);
  };

  if(blocked)return<><div className="ph"><div className="pt">Place Order</div></div><div className="pb"><div className="alert aw"><span>⛔</span><div><strong>Orders blocked.</strong> Upload receiving for all dispatched challans first.</div></div></div></>;
  if(done)return<><div className="ph"><div className="pt">Place Order</div></div><div className="pb"><div className="alert aok"><span>✅</span><strong>Order placed!</strong> Your TSE will approve it shortly.</div><button className="btn bam" onClick={()=>{setDone(false);setItems(CEMENTS.map(c=>({cement:c,qty:'',seq:''})));setDestId('');setDest('counter');}}>+ Place Another Order</button></div></>;

  return <>
    <div className="ph"><div><div className="pt">Place New Order</div><div className="ps">Total: <strong style={{color:'#f59e0b'}}>{total} bags</strong></div></div></div>
    <div className="pb">
      <div className="card">
        <div className="ch"><span className="ct">Step 1 — Delivery Destination</span></div>
        <div className="cb">
          <div className="r3" style={{marginBottom:12}}>
            {[['counter','🏬','My Counter'],['retailer','🏪','Retailer'],['site','🏗️','Site']].map(([v,ic,lb])=>(
              <div key={v} className={`dopt${dest===v?' sel':''}`} onClick={()=>{setDest(v);setDestId('');}}>
                <div className="di">{ic}</div><div className="dl">{lb}</div>
              </div>
            ))}
          </div>
          {dest==='retailer'&&<div className="fg"><label>Select Retailer</label><select value={destId} onChange={e=>setDestId(e.target.value)}><option value="">-- Choose --</option>{d.retailers.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></div>}
          {dest==='site'&&<div className="fg"><label>Select Site</label><select value={destId} onChange={e=>setDestId(e.target.value)}><option value="">-- Choose --</option>{d.sites.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>}
        </div>
      </div>
      <div className="card">
        <div className="ch"><span className="ct">Step 2 — Warehouse & Dispatch Type</span></div>
        <div className="cb">
          <div className="r2">
            <div className="fg"><label>Preferred Warehouse</label><select value={wh} onChange={e=>setWh(e.target.value)}>{WHS.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
            <div className="fg"><label>Dispatch Type</label><select value={type} onChange={e=>setType(e.target.value)}><option value="FOR">FOR – Logistics arranges vehicle</option><option value="EX">EX – Own vehicle</option></select></div>
          </div>
        </div>
      </div>
      <div className="card">
        <div className="ch"><span className="ct">Step 3 — Items & Loading Sequence</span><span style={{fontSize:11,color:'#6b7280'}}>Seq = loading order</span></div>
        <div className="cb">
          {items.map((item,i)=>(
            <div key={item.cement} className="cr">
              <span className="cn">{item.cement}</span>
              <span style={{fontSize:11,color:'#6b7280'}}>Bags</span>
              <input className="ci" type="number" min="0" value={item.qty} placeholder="0" onChange={e=>setItems(items.map((it,j)=>j===i?{...it,qty:e.target.value}:it))}/>
              <span style={{fontSize:11,color:'#6b7280'}}>Seq</span>
              <input className="ci cs" type="number" min="1" value={item.seq} placeholder="#" onChange={e=>setItems(items.map((it,j)=>j===i?{...it,seq:e.target.value}:it))}/>
            </div>
          ))}
          <div style={{marginTop:12,textAlign:'right'}}><button className="btn bam" onClick={submit} disabled={saving}>{saving?<><span className="spin"/> Saving…</>:'Submit Order →'}</button></div>
        </div>
      </div>
    </div>
  </>;
}

function DealerOrders({user,orders,setOrders,myOrders,filter,title}){
  const list=myOrders.filter(o=>filter.includes(o.status));
  const[uploadId,setUploadId]=useState(null);
  const[remarks,setRemarks]=useState('');

  const markReceived=async(id)=>{
    const upd={receivingUploaded:true,status:'closed'};
    try{await api('uploadReceiving',{orderId:id,uploadedBy:user.email,uploaderRole:'dealer',remarks});}
    catch(e){if(!demoFallback(e,()=>{}))return;}
    setOrders(orders.map(o=>o.id===id?{...o,...upd,remarks:remarks||o.remarks}:o));
    setUploadId(null);setRemarks('');
  };

  return <>
    <div className="ph"><div className="pt">{title}</div><div className="ps">{list.length} order(s)</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">📋</div>No orders here</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#f59e0b'}}>{o.id}</strong>
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <span style={{fontSize:12,color:'#6b7280'}}>{fmtD(o.placedAt)}</span>
          </div>
          <div className="cb">
            <OInfo o={o}/>
            {o.status==='dispatched'&&!o.receivingUploaded&&(
              <div className="alert aw" style={{marginTop:12}}>
                <span>⚠️</span><div><strong>Action Required:</strong> Upload receiving for challan <strong>{o.challanId}</strong> within 24 hours.
                <button className="btn bam bsm" style={{marginLeft:10}} onClick={()=>setUploadId(o.id)}>📷 Upload Receiving</button></div>
              </div>
            )}
            {o.receivingUploaded&&<div className="alert aok" style={{marginTop:10}}><span>✅</span> Receiving uploaded — Order closed{o.remarks?` · Remarks: ${o.remarks}`:''}</div>}
          </div>
        </div>
      ))}
    </div>
    {uploadId&&(
      <UploadModal title="Upload Receiving" subtitle="Upload the signed delivery challan received from driver" onClose={()=>{setUploadId(null);setRemarks('');}} onSave={()=>markReceived(uploadId)} showRemarks={true} remarks={remarks} setRemarks={setRemarks}/>
    )}
  </>;
}

function Contacts({user,dealers,setDealers,type}){
  const d=dealers[user.id];
  const[modal,setModal]=useState(false);
  const[name,setName]=useState('');
  const[extra,setExtra]=useState('');
  const items=type==='retailers'?d.retailers:d.sites;
  const save=async()=>{
    if(!name.trim())return;
    const newItem=type==='retailers'?{id:'R'+Date.now(),name:name.trim(),phone:extra}:{id:'S'+Date.now(),name:name.trim(),address:extra};
    try{
      if(type==='retailers') await api('addRetailer',{dealerId:user.id,name:name.trim(),phone:extra});
      else await api('addSite',{dealerId:user.id,name:name.trim(),address:extra});
    }catch(e){if(!demoFallback(e,()=>{}))return;}
    setDealers({...dealers,[user.id]:{...d,[type]:[...items,newItem]}});
    setModal(false);setName('');setExtra('');
  };
  return <>
    <div className="ph">
      <div><div className="pt">{type==='retailers'?'My Retailers':'My Sites'}</div><div className="ps">{items.length} registered</div></div>
      <button className="btn bam" onClick={()=>setModal(true)}>+ Add {type==='retailers'?'Retailer':'Site'}</button>
    </div>
    <div className="pb">
      {items.length===0&&<div className="card"><div className="empty"><div className="empty-i">{type==='retailers'?'🏪':'🏗️'}</div>None added yet</div></div>}
      {items.map(it=>(
        <div key={it.id} className="dc">
          <div><div style={{fontWeight:600,color:'#e8e6e0',marginBottom:2}}>{it.name}</div><div style={{fontSize:12,color:'#6b7280'}}>{type==='retailers'?it.phone:it.address}</div></div>
          <span className="chip">{type==='retailers'?'Retailer':'Site'}</span>
        </div>
      ))}
    </div>
    {modal&&<div className="ov"><div className="modal">
      <div className="mh"><span className="mt">Add {type==='retailers'?'Retailer':'Site'}</span><button className="btn bgh bsm" onClick={()=>setModal(false)}>✕</button></div>
      <div className="mb">
        <div className="fg"><label>Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder={type==='retailers'?'Shop name':'Site name'}/></div>
        <div className="fg"><label>{type==='retailers'?'Phone Number':'Address'}</label><input value={extra} onChange={e=>setExtra(e.target.value)} placeholder={type==='retailers'?'10-digit mobile':'Full address'}/></div>
      </div>
      <div className="mf"><button className="btn bgh" onClick={()=>setModal(false)}>Cancel</button><button className="btn bam" onClick={save}>Save</button></div>
    </div></div>}
  </>;
}

  const pending=myOrders.filter(o=>o.status==='placed');

    try{await api('updateOrderStatus',{orderId:id,status:newStatus,changedBy:user.email});}

    setOrders(orders.map(o=>o.id===id?{...o,status:newStatus,approvedAt:new Date().toISOString()}:o));

            </div>
          </div>

      ))}

function WHVehicle({user,orders,setOrders,myOrders}){
  const list=myOrders.filter(o=>o.status==='approved');
  const[sel,setSel]=useState(null);
  const[vNum,setVNum]=useState('');
  const[driver,setDriver]=useState('');
  const[dPhone,setDPhone]=useState('');
  const[saving,setSaving]=useState(false);

  const assign=async()=>{
    if(!vNum.trim()||!driver.trim()){alert('Fill vehicle number and driver name');return;}
    const challanId='CH'+Date.now().toString().slice(-5);
    const upd={status:'vehicle_found',vehicleAt:new Date().toISOString(),challanId,vehicle:{number:vNum.trim(),driver:driver.trim(),phone:dPhone.trim()}};
    setSaving(true);
    try{await api('assignVehicle',{orderId:sel,vehicle:{number:vNum.trim(),driver:driver.trim(),phone:dPhone.trim()},assignedBy:user.email});}
    catch(e){if(!demoFallback(e,()=>{})){setSaving(false);return;}}
    setOrders(orders.map(o=>o.id===sel?{...o,...upd}:o));
    setSaving(false);setSel(null);setVNum('');setDriver('');setDPhone('');
  };

  return <>
    <div className="ph"><div className="pt">Assign Vehicle</div><div className="ps">{list.length} order(s) looking for vehicle</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">🚛</div>No orders awaiting vehicle</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#f59e0b'}}>{o.id}</strong>
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <button className="btn bam bsm" onClick={()=>setSel(o.id)}>Assign Vehicle</button>
          </div>
          <div className="cb"><OInfo o={o}/></div>
        </div>
      ))}
    </div>
    {sel&&<div className="ov"><div className="modal">
      <div className="mh"><span className="mt">Assign Vehicle & Create Challan</span><button className="btn bgh bsm" onClick={()=>setSel(null)}>✕</button></div>
      <div className="mb">
        <div className="fg"><label>Vehicle Number</label><input value={vNum} onChange={e=>setVNum(e.target.value)} placeholder="UP65AB1234"/></div>
        <div className="r2">
          <div className="fg"><label>Driver Name</label><input value={driver} onChange={e=>setDriver(e.target.value)} placeholder="Full name"/></div>
          <div className="fg"><label>Driver Phone</label><input value={dPhone} onChange={e=>setDPhone(e.target.value)} placeholder="Mobile number"/></div>
        </div>
        <div className="alert ai"><span>ℹ️</span>A Delivery Challan ID will be auto-generated. Status will change to "Vehicle Found – Loading Started".</div>
      </div>
      <div className="mf"><button className="btn bgh" onClick={()=>setSel(null)}>Cancel</button><button className="btn bam" onClick={assign} disabled={saving}>{saving?<><span className="spin"/> Saving…</>:'Save & Create Challan'}</button></div>
    </div></div>}
  </>;
}

function WHLoading({user,orders,setOrders,myOrders}){
  const list=myOrders.filter(o=>o.status==='vehicle_found');
  const[dispId,setDispId]=useState(null);
  const dispatch=async()=>{
    try{await api('updateOrderStatus',{orderId:dispId,status:'dispatched',changedBy:user.email});}
    catch(e){if(!demoFallback(e,()=>{}))return;}
    setOrders(orders.map(o=>o.id===dispId?{...o,status:'dispatched',dispatchedAt:new Date().toISOString()}:o));
    setDispId(null);
  };
  return <>
    <div className="ph"><div className="pt">Currently Loading</div><div className="ps">{list.length} vehicle(s) being loaded</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">📦</div>No loading in progress</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#f59e0b'}}>{o.id}</strong>
              {o.challanId&&<span className="chip">Challan: {o.challanId}</span>}
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <button className="btn bam bsm" onClick={()=>setDispId(o.id)}>📷 Upload Challan & Dispatch</button>
          </div>
          <div className="cb"><OInfo o={o}/></div>
        </div>
      ))}
    </div>
    {dispId&&<UploadModal title="Upload Signed Delivery Challan" subtitle="Photograph the hand-written challan before dispatching the vehicle" onClose={()=>setDispId(null)} onSave={dispatch}/>}
  </>;
}

function WHReceiving({user,orders,setOrders,myOrders}){
  const list=myOrders.filter(o=>o.status==='dispatched'&&!o.receivingUploaded);
  const[upId,setUpId]=useState(null);
  const[remarks,setRemarks]=useState('');
  const mark=async()=>{
    try{await api('uploadReceiving',{orderId:upId,uploadedBy:user.email,uploaderRole:'logistics',remarks});}
    catch(e){if(!demoFallback(e,()=>{}))return;}
    setOrders(orders.map(o=>o.id===upId?{...o,receivingUploaded:true,status:'closed',remarks:remarks||o.remarks}:o));
    setUpId(null);setRemarks('');
  };
  return <>
    <div className="ph"><div className="pt">Upload Receiving</div><div className="ps">Challans pending receiving confirmation</div></div>
    <div className="pb">
      {list.length===0&&<div className="card"><div className="empty"><div className="empty-i">✅</div>All receivings uploaded!</div></div>}
      {list.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#f59e0b'}}>{o.id}</strong>
              {o.challanId&&<span className="chip">Challan: {o.challanId}</span>}
            </div>
            <button className="btn bbl bsm" onClick={()=>setUpId(o.id)}>📷 Upload Receiving</button>
          </div>
          <div className="cb">
            <div style={{fontSize:13,color:'#c9c6c0',marginBottom:4}}>Dealer: <strong style={{color:'#e8e6e0'}}>{o.dealerName}</strong> · {o.destination}: {o.destName}</div>
            {o.vehicle&&<div style={{fontSize:12,color:'#9ca3af'}}>🚛 {o.vehicle.number} · {o.vehicle.driver} · {o.vehicle.phone}</div>}
            <div style={{fontSize:12,color:'#ef4444',marginTop:7}}>⚠ Must upload within 24 hours of dispatch</div>
          </div>
        </div>
      ))}
    </div>
    {upId&&<UploadModal title="Upload Receiving" subtitle="Scan or photograph the returned delivery challan" onClose={()=>{setUpId(null);setRemarks('');}} onSave={mark} showRemarks={true} remarks={remarks} setRemarks={setRemarks}/>}
  </>;
}

// ══════════════════════════════════════════════
//  BRANCH MANAGER / ADMIN PAGES
// ══════════════════════════════════════════════
function AdminOrders({myOrders}){
  const[filter,setFilter]=useState('all');
  const[search,setSearch]=useState('');
  const filtered=myOrders.filter(o=>{
    if(filter!=='all'&&o.status!==filter) return false;
    if(search&&!o.dealerName.toLowerCase().includes(search.toLowerCase())&&!o.id.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  const counts={all:myOrders.length};
  myOrders.forEach(o=>{counts[o.status]=(counts[o.status]||0)+1;});

  return <>
    <div className="ph"><div className="pt">All Orders</div><div className="ps">{myOrders.length} total across all territories</div></div>
    <div className="pb">
      <div className="sg">
        <div className="sc"><div className="sv">{counts.placed||0}</div><div className="sl">Awaiting Approval</div></div>
        <div className="sc"><div className="sv" style={{color:'#4ade80'}}>{counts.approved||0}</div><div className="sl">Looking for Vehicle</div></div>
        <div className="sc"><div className="sv" style={{color:'#fb923c'}}>{counts.vehicle_found||0}</div><div className="sl">Loading</div></div>
        <div className="sc"><div className="sv" style={{color:'#a78bfa'}}>{counts.dispatched||0}</div><div className="sl">Dispatched</div></div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        {['all','placed','approved','vehicle_found','dispatched','closed'].map(s=>(
          <button key={s} className={`btn ${filter===s?'bam':'bgh'} bsm`} onClick={()=>setFilter(s)}>
            {s==='all'?'All':sLabel(s).split('–')[0].trim()}
          </button>
        ))}
      </div>
      <div className="fg"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by dealer name or order ID…"/></div>
      {filtered.length===0&&<div className="card"><div className="empty"><div className="empty-i">📋</div>No orders match</div></div>}
      {filtered.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#f59e0b'}}>{o.id}</strong>
              <span className="chip">{o.territory}</span>
              {o.challanId&&<span className="chip">Challan: {o.challanId}</span>}
              <span className={`badge ${sCls(o.status)}`}>{sLabel(o.status)}</span>
            </div>
            <span style={{fontSize:12,color:'#6b7280'}}>{fmtD(o.placedAt)}</span>
          </div>
          <div className="cb"><OInfo o={o}/></div>
        </div>
      ))}
    </div>
  </>;
}

function AdminDealers({dealers}){
  const all=Object.values(DEMO_DEALERS);
  return <>
    <div className="ph"><div className="pt">All Dealers</div><div className="ps">{all.length} dealers across all territories</div></div>
    <div className="pb">
      {all.map((d,i)=>(
        <div key={i} className="card"><div className="cb">
          <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:'#f8f6f0',marginBottom:3}}>{d.name}</div>
              <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:6}}>
                <span className="chip">{d.territory}</span>
                <span className="chip">🏪 {d.retailers.length} Retailers</span>
                <span className="chip">🏗️ {d.sites.length} Sites</span>
              </div>
            </div>
          </div>
        </div></div>
      ))}
    </div>
  </>;
}

function AdminPending({myOrders}){
  const pending=myOrders.filter(o=>o.status==='dispatched'&&!o.receivingUploaded);
  return <>
    <div className="ph"><div className="pt">Pending Receivings</div><div className="ps">{pending.length} challan(s) awaiting receiving upload</div></div>
    <div className="pb">
      {pending.length===0&&<div className="card"><div className="empty"><div className="empty-i">✅</div>All receivings uploaded!</div></div>}
      {pending.length>0&&<div className="alert aw"><span>⚠️</span><strong>{pending.length} challan(s)</strong> have not been received yet. Dealers and logistics managers have been reminded.</div>}
      {pending.map(o=>(
        <div key={o.id} className="card">
          <div className="ch">
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <strong style={{color:'#f59e0b'}}>{o.id}</strong>
              <span className="chip">{o.territory}</span>
              {o.challanId&&<span className="chip">Challan: {o.challanId}</span>}
            </div>
            <span style={{fontSize:12,color:'#ef4444'}}>Receiving overdue</span>
          </div>
          <div className="cb">
            <div style={{fontSize:13,color:'#c9c6c0',marginBottom:4}}>Dealer: <strong style={{color:'#e8e6e0'}}>{o.dealerName}</strong> · {o.destination}: {o.destName}</div>
            {o.vehicle&&<div style={{fontSize:12,color:'#9ca3af',marginBottom:4}}>🚛 {o.vehicle.number} · {o.vehicle.driver} · {o.vehicle.phone}</div>}
            <div style={{fontSize:12,color:'#6b7280'}}>Dispatched: {fmtDT(o.dispatchedAt||o.placedAt)}</div>
          </div>
        </div>
      ))}
    </div>
  </>;
}

// ══════════════════════════════════════════════
//  SHARED COMPONENTS
// ══════════════════════════════════════════════
function OInfo({o}){
  return(
    <div className="r2">
      <div>
        <div style={{fontSize:11,color:'#6b7280',marginBottom:5,textTransform:'uppercase',letterSpacing:'.04em'}}>Details</div>
        <div style={{fontWeight:600,color:'#e8e6e0',fontSize:14,marginBottom:2}}>{o.dealerName}</div>
        <div style={{fontSize:12,color:'#9ca3af',marginBottom:2}}>📍 {o.destination}: {o.destName}</div>
        <div style={{fontSize:12,color:'#9ca3af',marginBottom:2}}>🏭 {whName(o.warehouse)}</div>
        <div style={{fontSize:12,color:'#9ca3af'}}>🚚 <span className="chip">{o.type}</span></div>
        {o.vehicle&&<div style={{fontSize:12,color:'#9ca3af',marginTop:5}}>🚛 {o.vehicle.number} · {o.vehicle.driver} · {o.vehicle.phone}</div>}
        {o.remarks&&<div style={{fontSize:12,color:'#fbbf24',marginTop:5}}>📝 {o.remarks}</div>}
      </div>
      <div>
        <div style={{fontSize:11,color:'#6b7280',marginBottom:5,textTransform:'uppercase',letterSpacing:'.04em'}}>Items</div>
        {o.items.map(i=>(
          <div key={i.cement} style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'#c9c6c0',marginBottom:3,paddingBottom:3,borderBottom:'1px solid #1a1d28'}}>
            <span>#{i.seq} {i.cement}</span><span style={{color:'#f59e0b',fontWeight:700}}>{i.qty} bags</span>
          </div>
        ))}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginTop:4,paddingTop:4,borderTop:'1px solid #2a2d3a'}}>
          <span style={{color:'#6b7280'}}>Total</span>
          <span style={{color:'#f59e0b',fontWeight:700}}>{totalBags(o.items)} bags</span>
        </div>
      </div>
    </div>
  );
}

function UploadModal({title,subtitle,onClose,onSave,showRemarks,remarks,setRemarks}){
  const[file,setFile]=useState(null);
  return(
    <div className="ov">
      <div className="modal">
        <div className="mh"><span className="mt">{title}</span><button className="btn bgh bsm" onClick={onClose}>✕</button></div>
        <div className="mb">
          {subtitle&&<div style={{fontSize:13,color:'#9ca3af',marginBottom:12}}>{subtitle}</div>}
          <div className="uz">
            <input type="file" accept="image/*,.pdf" onChange={e=>setFile(e.target.files[0])}/>
            <div style={{fontSize:28,marginBottom:6}}>📎</div>
            {file?<div style={{fontSize:13}}><strong style={{color:'#f59e0b'}}>{file.name}</strong><br/><span style={{color:'#6b7280',fontSize:12}}>{(file.size/1024).toFixed(1)} KB</span></div>
            :<div style={{fontSize:13,color:'#6b7280'}}><strong style={{color:'#f59e0b'}}>Tap to choose file</strong> or drag & drop<br/>JPG, PNG, or PDF</div>}
          </div>
          {showRemarks&&<div className="fg" style={{marginTop:12}}>
            <label>Remarks (damaged / short goods? note here)</label>
            <textarea value={remarks} onChange={e=>setRemarks(e.target.value)} placeholder="e.g. 5 bags damaged, 2 bags short delivered…"/>
          </div>}
        </div>
        <div className="mf">
          <button className="btn bgh" onClick={onClose}>Cancel</button>
          <button className="btn bam" onClick={onSave}>Confirm Upload ✓</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
